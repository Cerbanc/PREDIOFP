   ===================================================================== */
const PL_COLS = [
  { c: 'nombre', t: 'Producto', w: 240, tipo: 'texto', ayuda: 'Nombre como lo ve el cajero. Obligatorio.' },
  { c: 'categoria', t: 'Categoría', w: 130, tipo: 'cat', ayuda: 'Elegí una o escribí una nueva: se crea sola.' },
  { c: 'tipo', t: 'Tipo', w: 112, tipo: 'tipo', ayuda: 'Producto: lleva su stock. Receta: se arma con insumos (pancho). Servicio: sin stock (café). Insumo: sólo para recetas.' },
  { c: 'precio', t: 'Precio', w: 90, tipo: 'num', ayuda: 'Precio de venta por unidad.' },
  { c: 'costo', t: 'Costo', w: 90, tipo: 'num', ayuda: 'Lo que te cuesta por unidad. Sólo se ve en Administración.' },
  { c: 'stock', t: 'Stock hoy', w: 90, tipo: 'num', ayuda: 'Unidades que hay HOY. Si lo cambiás en un producto que ya existe, queda como ajuste en el historial.' },
  { c: 'minimo', t: 'Mínimo', w: 80, tipo: 'num', ayuda: 'Avisa cuando queden estas unidades o menos.' },
  { c: 'paquete', t: 'Cómo viene', w: 128, tipo: 'texto', ayuda: 'Opcional. Ej: Caja x 24, Pack x 6' },
  { c: 'unidades', t: 'Unid. por paquete', w: 92, tipo: 'num', ayuda: 'Cuántas unidades trae el paquete (sirve para cargar remitos por paquete).' },
  { c: 'receta', t: 'Receta (sólo tipo Receta)', w: 260, tipo: 'texto', ayuda: 'Ingredientes que se descuentan al vender. Ej: 1 Salchicha + 1 Pan de pancho' },
  { c: 'activo', t: 'Activo', w: 64, tipo: 'bool', ayuda: 'Destildado: no aparece en la caja (queda el historial).' },
];
const PL_TIPOS = { directo: 'Producto', receta: 'Receta', servicio: 'Servicio', insumo: 'Insumo' };
const plConStock = t => t === 'directo' || t === 'insumo';
let PL_N = 0;

/* número con signo (para poder avisar de los negativos): vacío = null, texto raro = NaN */
function numSigno(v) {
  const raw = String(v ?? '').trim();
  if (raw === '') return null;
  if (/[^\d.,\s$-]/.test(raw)) return NaN;
  let t = raw.replace(/[^\d.,-]/g, '');
  if (!/\d/.test(t)) return NaN;
  if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
  else if (t.includes(',')) t = t.replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t);
  return isFinite(n) ? Math.round(n) : NaN;
}
const plRecetaTexto = r => (r || []).map(x => x.cant + ' ' + ((prod(x.id) || {}).nombre || '?')).join(' + ');
function plValoresDe(p) {
  const cs = plConStock(p.tipo);
  return {
    nombre: p.nombre, categoria: (catDe(p.catId) || {}).nombre || '', tipo: p.tipo,
    precio: p.tipo === 'insumo' ? '' : String(p.precio || ''), costo: p.tipo === 'receta' ? '' : (p.costo ? String(p.costo) : ''),
    stock: cs ? String(p.stock) : '', minimo: cs ? String(p.minimo || 0) : '', paquete: p.paqueteNombre || '',
    unidades: p.paqueteUnidades > 1 ? String(p.paqueteUnidades) : '', receta: p.tipo === 'receta' ? plRecetaTexto(p.receta) : '', activo: p.activo !== false,
  };
}
const plVacio = (cat) => ({ nombre: '', categoria: cat || '', tipo: 'directo', precio: '', costo: '', stock: '', minimo: '', paquete: '', unidades: '', receta: '', activo: true });
function plFilaNueva(cat) { return { k: 'r' + (++PL_N), id: null, v: plVacio(cat), orig: null, er: {}, erS: '' }; }
function plCargarDesdeDB() {
  const orden = DB.productos.slice().sort((a, b) => norm((catDe(a.catId) || {}).nombre).localeCompare(norm((catDe(b.catId) || {}).nombre)) || norm(a.nombre).localeCompare(norm(b.nombre)));
  const filas = orden.map(p => { const v = plValoresDe(p); return { k: 'r' + (++PL_N), id: p.id, v, orig: { ...v }, er: {}, erS: '' }; });
  if (!filas.length) for (let i = 0; i < 8; i++) filas.push(plFilaNueva(''));
  UI.pl = { filas, filtro: 'todos', q: '', aviso: '', ultCat: '' };
  plRevalidar(true);
}

/* qué columnas se pueden editar según el tipo */
function plDeshabilitado(f, c) {
  const t = f.v.tipo;
  if (c === 'precio') return t === 'insumo';
  if (c === 'costo') return t === 'receta';
  if (c === 'stock' || c === 'minimo') return !plConStock(t);
  if (c === 'receta') return t !== 'receta';
  return false;
}
const plNormCelda = (c, v) => { const col = PL_COLS.find(x => x.c === c); if (col.tipo === 'num') { const n = numSigno(v); return n === null ? '' : String(n); } if (col.tipo === 'bool') return v ? '1' : '0'; return String(v ?? '').trim(); };
/* columnas cambiadas respecto de lo que había (sólo filas que ya existían) */
function plCambios(f) {
  if (!f.orig) return [];
  return PL_COLS.map(x => x.c).filter(c => {
    if (plDeshabilitado(f, c) && plDeshabilitado({ v: f.orig }, c)) return false;
    return plNormCelda(c, f.v[c]) !== plNormCelda(c, f.orig[c]);
  });
}
const plTieneDatos = f => ['nombre', 'precio', 'costo', 'stock', 'minimo', 'paquete', 'unidades', 'receta'].some(c => String(f.v[c] ?? '').trim() !== '');
const plEstado = f => !f.id ? (plTieneDatos(f) ? 'nuevo' : 'vacia') : (plCambios(f).length ? 'cambio' : 'igual');

/* receta escrita como texto: "1 Salchicha + 1 Pan de pancho" */
function plParseReceta(txt, filas, yo) {
  const partes = String(txt || '').split(/\s*\+\s*|\s*;\s*|\r?\n/).map(x => x.trim()).filter(Boolean);
  const items = [], errores = [];
  partes.forEach(p => {
    let cant = 1, nom = p, m;
    if ((m = p.match(/^(\d+)\s*[x×*]\s*(.+)$/i)) || (m = p.match(/^(\d+)\s+(.+)$/))) { cant = +m[1]; nom = m[2]; }
    else if ((m = p.match(/^(.+?)\s*[x×*]\s*(\d+)$/i))) { cant = +m[2]; nom = m[1]; }
    const n = norm(nom).trim();
    const cand = filas.filter(r => r !== yo && r.v.nombre.trim());
    let hit = cand.filter(r => norm(r.v.nombre).trim() === n);
    if (!hit.length) hit = cand.filter(r => norm(r.v.nombre).startsWith(n));
    if (!hit.length) hit = cand.filter(r => norm(r.v.nombre).includes(n));
    if (hit.length !== 1) { errores.push(hit.length ? `«${nom}» coincide con varios productos: escribí el nombre completo` : `No existe el producto «${nom}»`); return; }
    if (!(cant >= 1)) { errores.push(`La cantidad de «${nom}» tiene que ser 1 o más`); return; }
    if (!plConStock(hit[0].v.tipo)) { errores.push(`«${hit[0].v.nombre}» no puede ser ingrediente (es ${PL_TIPOS[hit[0].v.tipo]})`); return; }
    items.push({ fila: hit[0], cant });
  });
  const vistos = new Set();
  items.forEach(i => { if (vistos.has(i.fila.k)) errores.push(`«${i.fila.v.nombre}» está repetido en la receta`); vistos.add(i.fila.k); });
  return { items, errores };
}

function plValidarFila(f, dup) {
  const v = f.v, er = {}, nuevo = !f.id, cam = plCambios(f);
  const nom = v.nombre.trim();
  if (plEstado(f) === 'vacia') return er;
  if (!nom) er.nombre = 'Falta el nombre';
  else if (dup.get(norm(nom)) > 1) er.nombre = 'Hay otro producto con este nombre';
  if (nuevo && !v.categoria.trim()) er.categoria = 'Falta la categoría';
  const num = (c, min, msg) => { const n = numSigno(v[c]); if (Number.isNaN(n)) er[c] = 'Poné sólo números'; else if (n !== null && n < min) er[c] = msg; return n; };
  if (!plDeshabilitado(f, 'precio')) {
    const n = num('precio', 0, 'No puede ser negativo');
    if (!er.precio && (nuevo || cam.includes('precio')) && !(n > 0)) er.precio = 'Falta el precio';
  }
  if (!plDeshabilitado(f, 'costo')) num('costo', 0, 'No puede ser negativo');
  if (!plDeshabilitado(f, 'stock')) {
    const n = numSigno(v.stock);
    if (Number.isNaN(n)) er.stock = 'Poné sólo números';
    else if (n === null) { if (!nuevo) er.stock = 'Poné cuánto hay (0 si no hay)'; }
    else if (n < 0 && (nuevo || cam.includes('stock'))) er.stock = 'El stock no puede ser negativo (si falta mercadería, poné 0)';
  }
  if (!plDeshabilitado(f, 'minimo')) num('minimo', 0, 'No puede ser negativo');
  num('unidades', 1, 'Tiene que ser 1 o más');
  if (v.tipo === 'receta') {
    if (!String(v.receta).trim()) er.receta = 'Escribí los ingredientes, ej: 1 Salchicha + 1 Pan';
    else { const r = plParseReceta(v.receta, UI.pl.filas, f); if (r.errores.length) er.receta = r.errores[0]; }
  }
  return er;
}
/* revisa todas las filas; sólo toca la pantalla de las filas cuyo estado cambió */
function plRevalidar(sinPantalla) {
  const P = UI.pl, dup = new Map();
  P.filas.forEach(f => { const n = norm(f.v.nombre.trim()); if (n) dup.set(n, (dup.get(n) || 0) + 1); });
  P.filas.forEach(f => {
    const er = plValidarFila(f, dup), s = JSON.stringify(er) + '|' + plEstado(f) + '|' + plCambios(f).join(',');
    if (s !== f.erS) { f.er = er; f.erS = s; if (!sinPantalla) plPintarFila(f); }
  });
  if (!sinPantalla) plPintarEstado();
}
const plClaseFila = f => { const e = plEstado(f); return 'pl-' + e + (Object.keys(f.er).length ? ' pl-err' : ''); };
const plPill = f => {
  const e = plEstado(f), cam = plCambios(f);
  if (Object.keys(f.er).length) return '<span class="pill bad">revisar</span>';
  if (e === 'nuevo') return '<span class="pill good">nuevo</span>';
  if (e === 'cambio') return `<span class="pill warn" title="${esc(cam.map(c => PL_COLS.find(x => x.c === c).t).join(', '))}">cambió</span>`;
  return '';
};
function plCeldaHTML(f, col) {
  const v = f.v[col.c], er = f.er[col.c], dis = plDeshabilitado(f, col.c);
  const cls = 'pl-in' + (er ? ' bad' : '') + (col.tipo === 'num' ? ' r' : '') + (dis ? ' off' : '');
  let inner;
  if (col.tipo === 'tipo') inner = `<select class="${cls}" data-c="tipo">${Object.entries(PL_TIPOS).map(([k, n]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  else if (col.tipo === 'bool') inner = `<input type="checkbox" class="pl-chk" data-c="activo" ${v ? 'checked' : ''} aria-label="Activo">`;
  else if (col.tipo === 'cat') inner = `<input class="${cls}" data-c="categoria" list="pl-cats" value="${esc(v)}" autocomplete="off">`;
  else inner = `<input class="${cls}" data-c="${col.c}" value="${esc(v)}" ${col.tipo === 'num' ? 'inputmode="numeric"' : ''} ${dis ? 'tabindex="-1" readonly' : ''} autocomplete="off" spellcheck="false">`;
  return `<td title="${esc(er || '')}" class="${col.c === 'nombre' ? 'pl-nom' : ''}">${inner}</td>`;
}
const plFilaHTML = f => `<tr data-k="${f.k}" class="${plClaseFila(f)}"><td class="pl-st">${plPill(f)}</td>${PL_COLS.map(c => plCeldaHTML(f, c)).join('')}<td class="pl-x">${f.id ? '' : `<button class="icon" data-act="pl-quitar" data-k="${f.k}" aria-label="Quitar esta fila">×</button>`}</td></tr>`;
function plPintarFila(f, enfocar) {
  const tr = document.querySelector(`#pl-body tr[data-k="${f.k}"]`);
  if (!tr) return;
  if (enfocar) { tr.outerHTML = plFilaHTML(f); const n = document.querySelector(`#pl-body tr[data-k="${f.k}"] [data-c="${enfocar}"]`); if (n) n.focus(); return; }
  tr.className = plClaseFila(f);
  tr.querySelector('.pl-st').innerHTML = plPill(f);
  PL_COLS.forEach(col => {
    const inp = tr.querySelector(`[data-c="${col.c}"]`); if (!inp) return;
    const er = f.er[col.c], dis = plDeshabilitado(f, col.c);
    inp.classList.toggle('bad', !!er); inp.classList.toggle('off', dis);
    if (inp.tagName === 'INPUT' && col.tipo !== 'bool' && col.tipo !== 'cat') { inp.readOnly = dis; inp.tabIndex = dis ? -1 : 0; }
    inp.closest('td').title = er || '';
  });
}
function plVisible(f) {
  const P = UI.pl, e = plEstado(f), q = norm(P.q);
  if (q && !norm(f.v.nombre + ' ' + f.v.categoria).includes(q)) return false;
  if (P.filtro === 'cambios') return e === 'cambio' || e === 'nuevo' || Object.keys(f.er).length > 0;
  if (P.filtro === 'errores') return Object.keys(f.er).length > 0;
  if (P.filtro === 'nuevos') return e === 'nuevo' || e === 'vacia';
  if (P.filtro === 'sinstock') return plConStock(f.v.tipo) && !(numSigno(f.v.stock) > 0);

}
function plAplicarFiltro() { UI.pl.filas.forEach(f => { const tr = document.querySelector(`#pl-body tr[data-k="${f.k}"]`); if (tr) tr.hidden = !plVisible(f); }); }
function plCuentas() {
  const c = { nuevo: 0, cambio: 0, err: 0, total: 0, sinstock: 0 };
  UI.pl.filas.forEach(f => { const e = plEstado(f); if (e === 'vacia') return; c.total++; if (e === 'nuevo') c.nuevo++; if (e === 'cambio') c.cambio++; if (Object.keys(f.er).length) c.err++; if (plConStock(f.v.tipo) && !(numSigno(f.v.stock) > 0)) c.sinstock++; });
  return c;
}
function plPintarEstado() {
  const c = plCuentas(), pie = $('#pl-pie'); if (!pie) return;
  const pend = c.nuevo + c.cambio;
  $('#pl-resumen').innerHTML = `<b>${c.total}</b> productos · <span class="${c.nuevo ? 'pl-b good' : ''}">${c.nuevo} nuevos</span> · <span class="${c.cambio ? 'pl-b warn' : ''}">${c.cambio} modificados</span> · <span class="${c.err ? 'pl-b bad' : ''}">${c.err} para revisar</span>`;
  $('#pl-guardar').disabled = pend === 0 || c.err > 0;
  $('#pl-descartar').disabled = pend === 0;
  $('#pl-guardar').textContent = pend ? `Guardar ${pend} cambio${pend === 1 ? '' : 's'}` : 'Guardar cambios';
  const chips = { todos: `Todos (${c.total})`, cambios: `Con cambios (${pend})`, errores: `Para revisar (${c.err})`, nuevos: 'Nuevos', sinstock: `Sin stock (${c.sinstock})` };
  document.querySelectorAll('[data-act="pl-filtro"]').forEach(b => { b.textContent = chips[b.dataset.v]; b.setAttribute('aria-pressed', UI.pl.filtro === b.dataset.v); });
}
admBody.planilla = () => {
  if (!UI.pl) plCargarDesdeDB();
  const P = UI.pl, srv = SERVIDOR;

    ${P.aviso ? `<div class="note warn" style="margin-bottom:12px">${esc(P.aviso)}</div>` : ''}
    <div class="toolbar"><input class="in" id="pl-q" data-in="pl-q" placeholder="Buscar producto o categoría…" value="${esc(P.q)}" autocomplete="off">
      <div class="chips">${['todos', 'cambios', 'errores', 'nuevos', 'sinstock'].map(chip).join('')}</div>

      <button class="btn sm" data-act="pl-exportar">Bajar planilla con lo que hay</button><button class="btn sm" data-act="pl-plantilla">Bajar plantilla vacía</button>` : ''}</span></div>

  plPintarEstado(); plAplicarFiltro();

/* ---- edición: eventos de la tabla ---- */
const plFila = el => { const tr = el.closest('tr[data-k]'); return tr && UI.pl.filas.find(f => f.k === tr.dataset.k); };
function plAlEscribir(e) {
  const el = e.target, c = el.dataset && el.dataset.c, f = c && plFila(el); if (!f) return;
  UI.adminUntil = Date.now() + 300000;
  const col = PL_COLS.find(x => x.c === c);
  f.v[c] = col.tipo === 'bool' ? el.checked : el.value;
  if (c === 'categoria' && el.value.trim()) UI.pl.ultCat = el.value.trim();
  if (c === 'tipo') { plRevalidar(); plPintarFila(f, 'tipo'); return; }
  plRevalidar();
}
function plAgregarFila(foco = true) {
  const f = plFilaNueva(UI.pl.ultCat); UI.pl.filas.push(f);
  $('#pl-body').insertAdjacentHTML('beforeend', plFilaHTML(f));
  plRevalidar(); plPintarEstado();
  if (foco) { const n = document.querySelector(`#pl-body tr[data-k="${f.k}"] [data-c="nombre"]`); if (n) { n.focus(); n.scrollIntoView({ block: 'nearest' }); } }
  return f;
}
function plMover(el, df, dc) {
  const cols = PL_COLS.map(x => x.c); let tr = el.closest('tr'), ci = cols.indexOf(el.dataset.c);
  const siguiente = (t, d) => { do { t = d > 0 ? t.nextElementSibling : t.previousElementSibling; } while (t && t.hidden); return t; };
  if (df) { tr = siguiente(tr, df); if (!tr && df > 0) { const f = plAgregarFila(false); tr = document.querySelector(`#pl-body tr[data-k="${f.k}"]`); } }
  if (!tr) return;

function parsearTabla(txt, sepForzado) {

  for (let i = 0; i < txt.length; i++) {

    if (q) { if (ch === '"' && txt[i + 1] === '"') { cel += '"'; i++; } else if (ch === '"') q = false; else cel += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { fila.push(cel); cel = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; fila.push(cel); cel = ''; if (fila.some(x => x.trim() !== '')) filas.push(fila); fila = []; }

  'bk-rest': () => modal({ title: 'Restaurar copia', wide: true, body: `<p class="muted">Pegá acá el contenido de una copia. Reemplaza todos los datos actuales.</p><textarea class="in mono" id="bk-txt" rows="10"></textarea>`, actions: [{ label: 'Cancelar' }, { label: 'Restaurar', kind: 'danger', onClick: () => {
    let d; try { d = JSON.parse($('#bk-txt').value); } catch (e) { toast('El texto no es una copia válida', 'bad'); return false; }
    if (!d || !Array.isArray(d.productos) || !Array.isArray(d.ventas) || !Array.isArray(d.metodos)) { toast('Falta información: no parece una copia de este sistema', 'bad'); return false; }
    const r = tx(() => { DB = d; normalizar(); }); if (r.ok) { toast('Copia restaurada'); render(); }
  } }] }),
  'sim-falla': () => {
    const p = DB.productos.find(x => x.tipo === 'directo' && x.stock > 0), antes = p.stock, nv = DB.contadores.venta;
    tx(() => { moverStock(p.id, -1, 'venta', { motivo: 'PRUEBA' }); DB.contadores.venta++; throw new Error('falla simulada a mitad de la venta (se cortó la luz)'); });
    const q = prod(p.id);
    modal({ title: 'Resultado de la prueba', body: `<p>Se descontó 1 unidad de <b>${esc(p.nombre)}</b>, se numeró un ticket y recién ahí "se cortó la luz".</p>
      <div class="card"><p>Stock antes: <b>${antes}</b> · Stock después de la falla: <b>${q.stock}</b></p><p>Nº de ticket antes: <b>${nv}</b> · después: <b>${DB.contadores.venta}</b></p></div>
      <div class="note">${q.stock === antes && DB.contadores.venta === nv ? 'Todo quedó igual que antes: no se perdió ni se inventó nada (rollback).' : 'Algo quedó a medias.'}</div>`, actions: [{ label: 'Entendido', kind: 'primary' }] });
  },
  'reset-hist': () => {
    const borrar = () => {
      if (SERVIDOR) {                  // lo hace el programa: copia de seguridad previa y un solo borrado (también lo que no está cargado en pantalla)
        try { http('POST', '/api/borrar-historial', { usuario: USUARIO() }); toast('Historial borrado. Se recarga la pantalla…'); setTimeout(() => location.reload(), 700); }
        catch (e) { toast(e.message, 'bad'); }
        return;
      }
      const r = tx(() => { DB.ventas = []; DB.movimientos = []; DB.caja = []; DB.turnos = []; logPush('sistema', '', 'Se borraron ventas, turnos, movimientos de stock y de caja'); DB.contadores.venta = 0; DB.comandas = { M: { items: [] } }; });
      if (r.ok) { toast('Historial borrado'); render(); }
    };
    const msg = 'Se borran tickets, turnos, movimientos de stock y movimientos de caja. Los productos y su stock actual se mantienen.' + (SERVIDOR ? ' Antes se hace una copia de seguridad (se puede volver atrás desde Datos y seguridad) y el borrado queda anotado.' : '');
    if (SERVIDOR) confirmarEscribiendo('Borrar ventas e historial', msg, 'BORRAR', borrar); else ask('Borrar ventas e historial', msg, 'Borrar', borrar, true);
  },
  'reset-demo': () => ask('Volver a datos de ejemplo', 'Se pierde todo lo que cargaste y se vuelven a cargar los datos de ejemplo.', 'Restablecer', () => { seed(); normalizar(); persist(); UI.com = 'M'; toast('Datos de ejemplo cargados'); render(); }, true),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  A[el.dataset.act](el.dataset, el, e);
});

/* campos de texto, selectores y fechas (evento "input") */
const mesaSel = () => DB.mesas.find(x => x.id === UI.mesaEdit);
const I = {
  'pl-q': el => { UI.pl.q = el.value; plAplicarFiltro(); },
  'pl-file': el => { const f = el.files && el.files[0]; if (f) plCargarArchivo(f); el.value = ''; },
  'conf-txt': el => { const b = $('#mact-1'); if (b) b.disabled = norm(el.value).trim() !== norm(CONF_PALABRA); },
  'sp-quien': el => { UI.sep.quien = el.value; },
  'pf-file': el => { procesarImagen(el.files && el.files[0]); },
  'rep-cob': el => { UI.repCob = Math.max(1, num(el.value) || 7); views.reportes(); const n = $('[data-in="rep-cob"]'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  'fi-cli': el => { UI.pago.clienteId = el.value; renderCobro(); },
  'fi-nuevo': () => { UI.pago.nuevoCli = { nombre: $('#fi-nom').value, tel: $('#fi-tel').value }; updateCobro(); },
  'pg-quien': el => { UI.pago.quien = el.value; },
  'dv-sel': el => { UI.pago.div[+el.dataset.i] = +el.value; $('#dv-sub').textContent = money(subtotalDividir()); },
  rp: () => { const sel = parseInt($('#rp-hora').value, 10); llenarHorasReprogramar(isNaN(sel) ? null : sel); },
  'rp-hora': () => pintarInfoReprogramar(),
  'cli-pick': el => { const c = DB.clientes.find(x => norm(x.nombre) === norm(el.value)), t = $(el.dataset.tel); if (c && t && !t.value) t.value = c.tel || ''; },
  'cfg-wa-pais': el => { DB.config.paisWa = soloDigitos(el.value) || '54'; persistSoon(); },
  'cfg-wa-msg': el => { DB.config.msgTurno = el.value; persistSoon(); },
  cc: () => pintarCierre(),
  cliq: el => { UI.cliQ = el.value; views.clientes(); const n = $('#cliq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  aj: () => {
    const P = UI.pago, tipo = $('#aj-tipo').value;
    P.ajuste = { tipo, valor: num($('#aj-valor').value), motivo: $('#aj-motivo').value, nota: $('#aj-nota').value.trim() };
    $('#aj-valor-wrap').hidden = tipo === 'costo';
    $('#aj-valor-lbl').textContent = tipo === 'pct' ? 'Porcentaje de descuento' : tipo === 'monto' ? 'Descuento en pesos' : 'Total final a cobrar';
    recalcCobro();
  },
  'tn-tipo': el => { const fijo = el.value === 'fijo'; $('#tn-sena-box').hidden = fijo; $('#tn-fijo-note').hidden = !fijo; },
  'cfg-turnos': el => { const r = tx(() => { DB.config.usarTurnos = el.checked; logPush('config', '', 'Calendario de turnos: ' + (el.checked ? 'activado' : 'desactivado')); }); if (!r.ok) { views.admin(); return; } if (!el.checked && UI.view === 'turnos') UI.view = 'venta'; render(); },
  'cfg-pin': el => { const r = tx(() => { DB.config.pedirPinAjuste = el.checked; logPush('config', '', 'Pedir el código para descuentos y ventas al costo: ' + (el.checked ? 'activado' : 'desactivado')); }); if (!r.ok) views.admin(); },
  'lg-f': el => { UI.lgTipo = el.value; admBody.registro(); },
  turf: el => { if (el.value) { UI.turFecha = el.value; views.turnos(); } },
  'cn-f': el => {
    const c = cancha(el.dataset.id); if (!c) return;
    const f = el.dataset.f, v = el.value;
    if (f === 'nombre') { if (!v.trim()) return; c.nombre = v.trim(); }
    else if (f === 'deporte' || f === 'catId' || f === 'lugarId') c[f] = v;
    else if (f === 'ap') c.ap = num(v) * 60;
    else if (f === 'ci') c.ci = num(v) * 60;
    else if (f === 'dur') c.dur = Math.max(15, num(v));
    else c[f] = num(v);
    persistSoon();
  },
  'mesa-tipo': el => { const m = mesaSel(); if (m) { m.tipo = el.value; persist(); views.mesas(); } },
  'mesa-w': el => { const m = mesaSel(); if (!m) return; m.w = +el.value; if (m.x + m.w > 100) m.x = 100 - m.w; persistSoon(); const n = $(`.mesa[data-id="${m.id}"]`); n.style.width = m.w + '%'; n.style.left = m.x + '%'; },
  'mesa-h': el => { const m = mesaSel(); if (!m) return; m.h = +el.value; if (m.y + m.h > 100) m.y = 100 - m.h; persistSoon(); const n = $(`.mesa[data-id="${m.id}"]`); n.style.height = m.h + '%'; n.style.top = m.y + '%'; },
  'mesa-rapido': el => { const m = mesaSel(); if (m) { m.rapido = el.checked; persist(); renderSide(); views.mesas(); } },
  'foto-file': el => { const f = el.files && el.files[0]; if (f) $('#foto-prev').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Foto del remito" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line)">`; },
  'foto-row': el => { const i = el.id.split('-')[2]; fotoResumen(+i); },
  q: el => { UI.q = el.value; renderGrid(); },
  dest: el => { UI.com = el.value; renderCart(); },
  pg: el => { UI.pago.rows[+el.dataset.i].monto = num(el.value); updateCobro(); },
  'pg-cliente': el => { UI.pago.cliente = el.value; updateCobro(); },
  'mesa-name': el => { const m = DB.mesas.find(x => x.id === UI.mesaEdit); if (m && el.value.trim()) { m.nombre = el.value.trim(); persistSoon(); const b = $(`.mesa[data-id="${m.id}"] b`); if (b) b.textContent = m.nombre; } },
  stockq: el => { UI.stockQ = el.value; views.stock(); const n = $('#stockq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  stockmov: el => { UI.stockMov = el.value; views.stock(); },
  ing: () => { const u = unidadesIngreso(), p = prod(UI.ing.id); $('#ing-prev').textContent = `Se suman ${u} unidades. El stock pasa de ${p.stock} a ${p.stock + u}.`; },
  tkd: el => { UI.tkDesde = el.value; views.tickets(); },
  tkh: el => { UI.tkHasta = el.value; views.tickets(); },
  tkq: el => { UI.tkQ = el.value; views.tickets(); const n = $('#tkq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  repd: el => { if (el.value) { UI.repDesde = el.value; views.reportes(); } },
  reph: el => { if (el.value) { UI.repHasta = el.value; views.reportes(); } },
  admq: el => { UI.admQ = el.value; admBody.productos(); const n = $('#admq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  'pf-tipo': el => { leerPF(); UI.pf.tipo = el.value; if (el.value === 'receta' && !UI.pf.receta.length) { const ins = DB.productos.find(p => p.tipo === 'insumo'); if (ins) UI.pf.receta.push({ id: ins.id, cant: 1 }); } mostrarFormProducto(); },
  'cat-name': el => { const c = catDe(el.dataset.id); if (c && el.value.trim()) { c.nombre = el.value.trim(); persistSoon(); } },
  'cat-color': el => { const r = tx(() => { catDe(el.dataset.id).color = el.value; }); if (r.ok) views.admin(); },
  'met-name': el => { const m = metodo(el.dataset.id); if (m && el.value.trim()) { m.nombre = el.value.trim(); persistSoon(); } },
  'met-act': el => { const r = tx(() => { const m = metodo(el.dataset.id); if (m.efectivo && !el.checked) throw new Error('El efectivo tiene que estar siempre activo'); m.activo = el.checked; }); if (!r.ok) views.admin(); },
  negocio: el => { DB.negocio = el.value.trim() || 'Predio Deportivo'; persistSoon(); renderSide(); },
};
document.addEventListener('input', e => {
  const el = e.target.closest('[data-in]');
  if (el && I[el.dataset.in]) { if (UI.view === 'admin') UI.adminUntil = Date.now() + 300000; I[el.dataset.in](el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL) closeModal();
  if (e.key === 'Enter' && e.target.id === 'q') { const l = listaVisible(); if (l.length === 1) { agregar(l[0].id); e.target.select(); } }
  if (e.key === 'Enter' && MODAL && e.target.matches('#modal-root input')) {
    const b = $('#modal-root .btn.primary:not(:disabled), #modal-root .btn.danger:not(:disabled)'); if (b) b.click();
  }
});

/* arrastrar y estirar lugares en modo edición */
let drag = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.salon.editing .mesa'); if (!t) return;
  const r = $('#salon').getBoundingClientRect(), tr = t.getBoundingClientRect();
  drag = { mode: e.target.closest('.rz') ? 'resize' : 'move', t, id: t.dataset.id, dx: e.clientX - tr.left, dy: e.clientY - tr.top, r, w: tr.width, h: tr.height, left: tr.left, top: tr.top, moved: false, sx: e.clientX, sy: e.clientY };
  try { t.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
  if (!drag.moved) return;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  if (drag.mode === 'resize') {
    const x0 = (drag.left - drag.r.left) / drag.r.width * 100, y0 = (drag.top - drag.r.top) / drag.r.height * 100;
    drag.nw = clamp((e.clientX - drag.left) / drag.r.width * 100, 6, 100 - x0);
    drag.nh = clamp((e.clientY - drag.top) / drag.r.height * 100, 8, 100 - y0);
    drag.t.style.width = drag.nw + '%'; drag.t.style.height = drag.nh + '%';
    return;
  }
  drag.x = clamp((e.clientX - drag.dx - drag.r.left) / drag.r.width * 100, 0, (drag.r.width - drag.w) / drag.r.width * 100);
  drag.y = clamp((e.clientY - drag.dy - drag.r.top) / drag.r.height * 100, 0, (drag.r.height - drag.h) / drag.r.height * 100);
  drag.t.style.left = drag.x + '%'; drag.t.style.top = drag.y + '%';
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  const m = DB.mesas.find(x => x.id === d.id);
  if (m) {
    if (d.mode === 'resize') { m.w = Math.round(d.nw * 10) / 10; m.h = Math.round(d.nh * 10) / 10; }
    else { m.x = Math.round(d.x * 10) / 10; m.y = Math.round(d.y * 10) / 10; }
    persist();
  }
  UI.mesaEdit = d.id; setTimeout(() => views.mesas(), 0);
});

/* ---------- arranque ---------- */
try { const t = localStorage.getItem('predio_pos_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sin memoria */ }
DB = cargar();
if (!DB) {                     // primera vez: base nueva (vacía) o, en la demostración, con datos de ejemplo
  ORIGEN = 'Sistema';
  try { if (SERVIDOR && PREDIO.modo !== 'demo') crearBase(); else seed(); guardarSync(); }
  catch (e) { toast('No se pudo preparar la base de datos: ' + e.message, 'bad'); }
  finally { ORIGEN = null; }
}
normalizar();
if (!DB.productos.length) UI.admTab = 'planilla';
render();
setInterval(() => { if (!MODAL && revisarTurnos()) render(); }, 30000);
if (SERVIDOR) {
  setInterval(() => { if (!ESTADO_GUARDADO.ok) { try { guardarSync(); } catch (e) { /* sigue sin guardar: ya se ve en pantalla */ } } }, 8000);   // si falló un guardado, se reintenta solo
  window.addEventListener('beforeunload', e => { if (!ESTADO_GUARDADO.ok) { e.preventDefault(); e.returnValue = ''; } });
  setTimeout(() => {
    try {
      const sa = http('GET', '/api/salud');
      if (sa.avisos && sa.avisos.length) modal({ title: 'Aviso importante', body: sa.avisos.map(x => `<p>${esc(x)}</p>`).join(''), actions: [{ label: 'Entendido', kind: 'primary' }] });
    } catch (e) { /* si falla, ya se vio en pantalla */ }
  }, 600);
}
window.__pos = { get DB() { return DB; }, get REV() { return REV; }, UI, tx, http, guardarSync };
</script>
