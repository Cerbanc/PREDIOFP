<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caja del Predio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fija (barra inferior en celular). La caja usa dos columnas: productos | comanda.
   Paleta: verdes grisáceos de cancha + un acento verde esmeralda; ámbar/azul/rojo quedan para las categorías. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface2:#e6ece9; --line:#d3dcd8;
  --fg:#14201c; --muted:#5a6a65;
  --accent:#0a7a5a; --accent-fg:#ffffff; --accent-soft:#d3eee3;
  --good:#17803f; --good-soft:#d9f0e1;
  --warn:#9a5b00; --warn-soft:#fbebc8;
  --bad:#bb3326; --bad-soft:#f9dad6;
  --info:#25679f; --info-soft:#dbe9f7;
  --side-bg:#12261f; --side-fg:#dcebe5; --side-mute:#8fb0a4;
  --shadow:0 1px 2px rgba(10,30,22,.08),0 4px 14px rgba(10,30,22,.06);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#151f1b; --surface2:#1c2924; --line:#2a3a33;
  --fg:#e5eee9; --muted:#93a79e;
  --accent:#3fc79a; --accent-fg:#04241a; --accent-soft:#143a2d;
  --good:#52cf86; --good-soft:#153725;
  --warn:#f0b24a; --warn-soft:#3b2d0f;
  --bad:#ff7d6e; --bad-soft:#41191a;
  --info:#6fb2ee; --info-soft:#16304a;
  --side-bg:#09100e; --side-fg:#d5e4dd; --side-mute:#7f9a8f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#151f1b; --surface2:#1c2924; --line:#2a3a33;
  --fg:#e5eee9; --muted:#93a79e;
  --accent:#3fc79a; --accent-fg:#04241a; --accent-soft:#143a2d;
  --good:#52cf86; --good-soft:#153725;
  --warn:#f0b24a; --warn-soft:#3b2d0f;
  --bad:#ff7d6e; --bad-soft:#41191a;
  --info:#6fb2ee; --info-soft:#16304a;
  --side-bg:#09100e; --side-fg:#d5e4dd; --side-mute:#7f9a8f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100%}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;padding:16px 12px;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-style:normal;font-size:15px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;color:inherit;border-radius:8px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current=page]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.16)}
.nav .badge.warn{background:var(--warn-soft);color:var(--warn)}
.nav [aria-current=page] .badge{background:rgba(0,0,0,.18)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 6px 0;font-size:12px;color:var(--side-mute)}
.side-foot button{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--side-fg);border-radius:8px;padding:7px 10px;cursor:pointer}
.side-foot button:hover{background:rgba(255,255,255,.08)}
.demo-tag{background:var(--warn-soft);color:var(--warn);padding:6px 8px;border-radius:8px;font-weight:600;line-height:1.3}

main{overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;min-width:0}
main>*{flex:none}
main>.pos{flex:1 1 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.lg{min-height:52px;font-size:17px;padding:12px 18px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-weight:700}
.icon:hover{background:var(--surface2)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:38px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.fld .in{font-weight:400;font-size:14px}
.fld small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip:hover{background:var(--surface2)}
.chip.sm{padding:3px 10px;font-size:12px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h,160) 62% 46%);display:inline-block;flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{margin-bottom:10px}

/* Caja */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:16px;flex:1;min-height:0}
.pos-l{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pos-top{display:flex;gap:10px;flex-wrap:wrap}
.pos-top .chips{flex:1 1 auto}
.search{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;overflow:auto;padding:2px 2px 8px;align-content:start;flex:1;min-height:0}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:hsl(var(--h,160) 62% 46%)}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.985)}
.tile b{font-size:15px;line-height:1.2}
.tile .pr{font-weight:800;font-size:16px;margin-top:auto;font-variant-numeric:tabular-nums}
.tile .st{font-size:12px;font-weight:600;color:var(--muted)}
.tile .st.warn{color:var(--warn)} .tile .st.bad{color:var(--bad)}
.pos-r{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.cart-h{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cart-h label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lines{flex:1;overflow:auto;padding:6px 14px;min-height:120px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line .nm{min-width:0}
.line .nm b{display:block;overflow-wrap:anywhere}
.line .nm small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ln-sub{font-weight:700;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.ln-tools{grid-column:1/-1;display:flex;gap:6px}
.ln-tools button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.ln-tools button:hover{color:var(--fg)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:28px 10px;gap:6px}
.cart-f{padding:12px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.total-row{display:flex;justify-content:space-between;align-items:baseline}
.total-row span{font-weight:700;color:var(--muted)}
.total-row.sm b{font-size:18px}
.total-row.saldo b{color:var(--warn)}
.abonos{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.ab{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.ab b{font-variant-numeric:tabular-nums;color:var(--good)}
.ab button{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.frow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) 70px 120px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.frow code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.total-row b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Mesas */
.salon{position:relative;border:1px solid var(--line);border-radius:var(--r);background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 10%,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/10% 100%, var(--surface);
  background-blend-mode:normal;height:min(62vh,540px);min-height:360px;touch-action:pan-y;overflow:hidden}
.salon.editing{outline:2px dashed var(--accent);outline-offset:-2px}
.mesa{position:absolute;container-type:size;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;box-shadow:var(--shadow);padding:4px;overflow:hidden}
.mesa b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-height:62px){.mesa small{display:none}}
@container (max-height:40px){.mesa span{display:none}}
.mesa .rz{display:none;position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-right:4px solid var(--accent);border-bottom:4px solid var(--accent);border-radius:0 0 10px 0;cursor:nwse-resize;touch-action:none}
.salon.editing .mesa .rz{display:block}
.mesa b{font-size:15px} .mesa span{font-weight:700;font-variant-numeric:tabular-nums}
.mesa small{color:var(--muted);font-size:11px;min-height:14px}
.mesa:not(.busy) span{color:var(--good)}
.mesa.t-futbol{background:color-mix(in srgb,var(--good-soft) 75%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.mesa.t-padel{background:color-mix(in srgb,var(--info-soft) 80%,var(--surface));border-color:color-mix(in srgb,var(--info) 50%,var(--line))}
.mesa.t-barra{background:var(--surface2);border-color:var(--fg)}
.mesa.busy{border-color:var(--warn);background:var(--warn-soft)}
.mesa.busy span{color:var(--warn)}
.salon.editing .mesa{cursor:grab;touch-action:none}
.mesa.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:10px;flex-wrap:wrap}

/* Tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{font-variant-numeric:tabular-nums}
tbody tr:hover td{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;max-width:240px}

/* Reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.bar .track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,15,11,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(480px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(720px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);width:32px;height:32px}
.mbody{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{color:var(--bad);font-weight:600}
.big-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface2);border-radius:10px;padding:12px 14px}
.big-total b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto;gap:8px;align-items:center}
.prow .pm{font-weight:700}
.money-in{display:flex;align-items:center;gap:6px}
.money-in span{color:var(--muted);font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 4px}
.pg-sum{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-weight:600}
.pg-sum .l{display:flex;justify-content:space-between}
.pg-sum .vuelto b{font-size:22px;color:var(--good)}
.pg-sum .falta b{color:var(--warn)}
.paper{font-family:var(--mono);font-size:12.5px;line-height:1.45;background:#fff;color:#111;padding:16px 14px;border-radius:6px;border:1px solid var(--line);white-space:pre-wrap;overflow:auto;margin:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.note{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)}

#toasts{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none;width:min(340px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);animation:in .18s ease-out}
.toast.warn{background:var(--warn);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:980px){
  .pos,main>.pos{grid-template-columns:1fr;flex:none}
  .grid{overflow:visible;flex:none}
  .pos-r{min-height:380px}
  body{overflow:auto}
}
@media (max-width:820px){
  body{overflow:hidden}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{order:2;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));overflow:hidden}
  .brand,.side-foot .demo-tag,.side-foot span{display:none}
  .nav{flex-direction:row;flex:1;overflow-x:auto;gap:0}
  .nav button{flex-direction:column;gap:1px;font-size:11px;padding:6px 8px;align-items:center;width:auto;flex:1 0 auto;position:relative}
  .nav .badge{position:absolute;top:2px;right:2px;margin:0;padding:0 5px;font-size:10px}
  .side-foot{margin:0;padding:0;flex-direction:row}
  .side-foot button{border:0;padding:6px}
  .side-foot button b{display:none}
  main{padding:14px 16px 20px}
  #toasts{top:10px;right:16px}
  .grid2{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:minmax(0,1fr) 120px auto}
  .search{max-width:none;width:100%}
  h1{font-size:21px}
}
/* Calendario de turnos */
.cal-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 230px);min-height:320px}
.cal{display:grid;min-width:max-content}
.chead{position:sticky;top:0;z-index:3;background:var(--surface2);padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.chead small{color:var(--muted);font-size:11px}
.chead.corner{left:0;z-index:5;border-left:0}
.tcol{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
.tcol span{position:absolute;right:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-1px)}
.ccol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hp)}
.slot{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:12px;cursor:pointer;border:1px dashed var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);line-height:1.25}
.slot b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.free:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot.res{border-style:solid}

<body>
<div id="app">
  <aside class="side">
    <div class="brand"><i>●</i><span id="brand-name">Predio</span></div>

<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   PROTOTIPO "CAJA DEL PREDIO"
   Simula el sistema real (Python + SQLite) dentro del navegador.
   - Los datos se guardan en este navegador (localStorage).
   - tx() hace lo mismo que commit/rollback en SQLite: si algo falla a la
     mitad de una operación, se vuelve al estado anterior y no queda nada a medias.
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const pad = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fechaHora = ts => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + hhmm(ts); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const num = v => Math.max(0, Math.round(parseFloat(String(v).replace(',', '.')) || 0));
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const hace = ts => { const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
const hm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const CAT_HUES = { ambar: 38, azul: 205, rojo: 8, verde: 150, violeta: 265, gris: 200 };
const TIPOS = {
  directo:  { n: 'Stock propio', d: 'Descuenta su propio stock (gaseosas, golosinas, pelotas).' },
  receta:   { n: 'Receta / combo', d: 'Al venderlo descuenta insumos (pancho = 1 salchicha + 1 pan).' },
  servicio: { n: 'Servicio sin stock', d: 'No se controla stock (turno de cancha, café, minutas).' },
  insumo:   { n: 'Insumo (no se vende solo)', d: 'Sólo se usa dentro de recetas (salchichas, panes).' },
};
const MOV = { ingreso: ['Ingreso', 'good'], venta: ['Venta', ''], ajuste: ['Ajuste', 'warn'], baja: ['Baja', 'bad'], anulacion: ['Anulación', 'warn'] };

/* ---------- íconos ---------- */
const ICON = {
  venta: '<path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
  mesas: '<rect x="3" y="5" width="7" height="6" rx="1.5"/><rect x="14" y="5" width="7" height="6" rx="1.5"/><rect x="3" y="14" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  stock: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  tickets: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  rep: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  admin: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  tema: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- base de datos (en memoria + localStorage) ---------- */
const LS_KEY = 'predio_pos_proto_v6';
let DB = null;
let STORAGE_OK = true;
const UI = {
  view: 'venta', cat: 'all', q: '', com: 'M', turFecha: dayKey(Date.now()), turSel: null, lgTipo: 'all',
  stockTab: 'inv', stockQ: '', stockF: 'all', stockMov: 'all',
  repDesde: dayKey(Date.now()), repHasta: dayKey(Date.now()),
  tkDesde: dayKey(Date.now() - 6 * 864e5), tkHasta: dayKey(Date.now()), tkQ: '',
  editSalon: false, mesaEdit: null, admTab: 'productos', admQ: '', adminUntil: 0,
};

function uid(prefix) { return prefix + (DB.seq++).toString(36); }
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); STORAGE_OK = true; }
  catch (e) { STORAGE_OK = false; }
}
function cargar() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.productos && d.ventas) return d; }
  } catch (e) { STORAGE_OK = false; }
  return null;
}
function normalizar() {
  DB.comandas = DB.comandas || {};
  if (!DB.comandas.M) DB.comandas.M = { items: [] };
  DB.negocio = DB.negocio || 'Predio Deportivo';
  DB.caja = DB.caja || []; DB.canchas = DB.canchas || []; DB.turnos = DB.turnos || []; DB.fijos = DB.fijos || []; DB.log = DB.log || [];
  DB.config = DB.config || { pedirPinAjuste: true };
  DB.mesas.forEach(m => { m.tipo = m.tipo || 'mesa'; m.w = m.w || 14; m.h = m.h || 17; });
}

/* Transacción: ejecuta fn; si lanza un error, restaura el estado anterior (rollback). */
function tx(fn) {
  const snap = JSON.stringify(DB);
  try {
    const value = fn();
    persist();
    return { ok: true, value };
  } catch (e) {
    DB = JSON.parse(snap);       // ROLLBACK
    toast('Operación cancelada, no se guardó nada: ' + e.message, 'bad');
    return { ok: false, error: e };
  }
}

/* ---------- acceso a datos ---------- */
const prod = id => DB.productos.find(p => p.id === id);
const metodo = id => DB.metodos.find(m => m.id === id);
const catDe = id => DB.categorias.find(c => c.id === id);
const hueDe = id => { const c = catDe(id); return c ? CAT_HUES[c.color] ?? 160 : 200; };
const stk = id => { const p = prod(id); return p ? p.stock : 0; };

/* Qué stock real consume vender `cant` unidades de un producto */
function consumo(p, cant) {
  if (p.tipo === 'servicio') return [];
  if (p.tipo === 'receta') return (p.receta || []).map(r => ({ id: r.id, cant: r.cant * cant }));
  return [{ id: p.id, cant }];
}
function consumoItems(items) {
  const m = {};
  items.forEach(it => { const p = prod(it.prodId); if (p) consumo(p, it.cant).forEach(c => { m[c.id] = (m[c.id] || 0) + c.cant; }); });
  return m;
}
function reservadoOtros(key) {
  const m = {};
  Object.entries(DB.comandas).forEach(([k, c]) => {
    if (k === key) return;
    const u = consumoItems(c.items);
    Object.entries(u).forEach(([id, n]) => { m[id] = (m[id] || 0) + n; });
  });
  return m;
}
function faltantes(items, key, conReservas) {
  const need = consumoItems(items);
  const res = conReservas ? reservadoOtros(key) : {};
  return Object.entries(need)
    .filter(([id, n]) => n > stk(id) - (res[id] || 0))
    .map(([id, n]) => ({ id, nombre: prod(id) ? prod(id).nombre : '(borrado)', need: n, sistema: stk(id), reservado: res[id] || 0 }));
}
function restante(p, res) {
  if (p.tipo === 'servicio') return Infinity;
  const need = consumo(p, 1);
  if (!need.length) return 0;
  return Math.min(...need.map(n => Math.floor((stk(n.id) - (res[n.id] || 0)) / n.cant)));
}

/* Movimiento de stock: único punto por donde cambia el stock. Nunca permite quedar negativo. */
function moverStock(id, delta, tipo, o = {}) {
  const p = prod(id);
  if (!p) throw new Error('Producto inexistente');
  const antes = p.stock, despues = antes + delta;
  if (despues < 0 && !o.permitirNegativo) throw new Error(`Stock insuficiente de ${p.nombre} (hay ${antes}, se necesitan ${-delta})`);
  p.stock = despues;
  DB.movimientos.push({ id: uid('mv'), ts: o.ts || Date.now(), prodId: id, nombre: p.nombre, tipo, cant: delta, antes, despues, ref: o.ref || null, motivo: (o.motivo || '') + (despues < 0 ? ' · stock en negativo' : '') });
}

/* Cobro: lo pagado puede cubrir parte o todo; el efectivo que sobra es vuelto */
function evalPago(total, rows) {
  const filas = rows.filter(r => r.monto > 0);
  const noCash = sum(filas.filter(r => !metodo(r.metodoId).efectivo), r => r.monto);
  const cashIn = sum(filas.filter(r => metodo(r.metodoId).efectivo), r => r.monto);
  const pagado = noCash + cashIn;
  const out = { noCash, cashIn, pagado, applied: 0, vuelto: 0, falta: 0, ok: false, error: '' };
  if (noCash > total) { out.error = 'Lo que se paga con medios que no son efectivo supera el total.'; return out; }
  out.applied = Math.min(cashIn, total - noCash);
  out.vuelto = cashIn - out.applied;
  out.falta = total - noCash - out.applied;
  out.ok = out.falta === 0 && total >= 0;
  return out;
}
const cancha = id => DB.canchas.find(c => c.id === id);
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const dowDe = f => new Date(f + 'T12:00:00').getDay();
const sumarDias = (f, n) => dayKey(new Date(f + 'T12:00:00').getTime() + n * 864e5);

/* Registro de cambios: todo ajuste de precio, anulación, corrección o devolución deja una línea acá y no se puede borrar */
const USUARIO = () => Date.now() < UI.adminUntil ? 'Administración' : 'Caja';
function logPush(tipo, ref, detalle, datos) {
  DB.log.push({ id: uid('lg'), ts: Date.now(), usuario: USUARIO(), tipo, ref: ref || '', detalle, datos: datos || null });
}
/* Libro de caja: cada cobro (parcial o total), devolución y corrección, con el medio de pago real. De acá salen los reportes. */
function cajaPush(metodoId, monto, tipo, motivo, ts) {
  const m = metodo(metodoId);
  if (!m) throw new Error('Medio de pago inexistente');
  DB.caja.push({ id: uid('cj'), ts: ts || Date.now(), metodoId, nombre: m.nombre, monto, tipo, motivo });
}

/* Costos (sólo se cargan y se ven en Administración). Una receta cuesta lo que cuestan sus ingredientes. */
function costoReceta(receta) {
  let t = 0;
  for (const r of receta || []) { const i = prod(r.id); if (!i || !(i.costo > 0)) return 0; t += i.costo * r.cant; }
  return t;
}
const costoUnit = p => p.tipo === 'receta' ? costoReceta(p.receta) : (p.costo > 0 ? p.costo : 0);
function lineasDeItems(items) {
  return items.map(it => {
    if (it.turnoId) {
      const t = DB.turnos.find(x => x.id === it.turnoId);
      if (!t) throw new Error('El turno de la cuenta ya no existe');
      return { prodId: null, nombre: nombreTurno(t), catId: cancha(t.canchaId).catId, tipo: 'servicio', cant: 1, precio: t.precio, costo: 0, nota: t.cliente, turnoId: t.id };
    }
    const p = prod(it.prodId);
    if (!p) throw new Error('Un producto de la comanda ya no existe');
    return { prodId: p.id, nombre: p.nombre, catId: p.catId, tipo: p.tipo, cant: it.cant, precio: p.precio, costo: costoUnit(p), nota: it.nota || '' };
  });
}
/* Descuento que corresponde a un ajuste: % , monto, total final o "al costo" */
function calcDescuento(subtotal, lineas, aj) {
  if (!aj) return 0;
  if (aj.tipo === 'pct') return Math.round(subtotal * Math.min(100, aj.valor || 0) / 100);
  if (aj.tipo === 'monto') return Math.min(subtotal, aj.valor || 0);
  if (aj.tipo === 'final') return Math.max(0, subtotal - Math.min(subtotal, aj.valor || 0));
  if (aj.tipo === 'costo') {
    const faltan = lineas.filter(l => !(l.costo > 0));
    if (faltan.length) throw new Error('Falta cargar el costo de: ' + faltan.map(l => l.nombre).join(', ') + ' (Admin → Productos)');
    return Math.max(0, subtotal - sum(lineas, l => l.costo * l.cant));
  }
  throw new Error('Tipo de ajuste desconocido');
}

/* Registrar una venta completa (stock + ticket + pagos + caja + registro), todo dentro de una transacción.
   `items` son productos de la comanda; `lineas` permite ventas sin producto (por ejemplo un turno de cancha). */
function commitVenta(o) {
  const ts = o.ts || Date.now();
  const lineas = o.lineas || lineasDeItems(o.items);
  if (!lineas.length) throw new Error('La comanda está vacía');
  const subtotal = sum(lineas, l => l.cant * l.precio);
  if (o.ajuste) {
    if (!o.ajuste.motivo) throw new Error('Falta el motivo del descuento');
    if (o.ajuste.tipo === 'costo' && !String(o.ajuste.nota || '').trim()) throw new Error('Poné el nombre del empleado en la nota');
  }
  const descuento = Math.min(subtotal, calcDescuento(subtotal, lineas, o.ajuste));
  const total = subtotal - descuento;
  const abonos = o.abonos || [], yaPagado = sum(abonos, a => a.monto);
  if (yaPagado > total) throw new Error('Lo ya pagado supera el total de la cuenta');
  const ev = evalPago(total - yaPagado, o.pagos);
  if (ev.error) throw new Error(ev.error);
  if (ev.falta > 0) throw new Error('Falta cobrar ' + money(ev.falta));

  const ventaId = uid('v');
  const nro = ++DB.contadores.venta;
  lineas.forEach(l => {
    const p = l.prodId ? prod(l.prodId) : null;
    if (p) consumo(p, l.cant).forEach(c => moverStock(c.id, -c.cant, 'venta', { ref: ventaId, ts, permitirNegativo: o.negativo, motivo: `Ticket #${nro} · ${l.nombre}` }));
  });
  // Pagos guardados por el monto realmente aplicado (el efectivo ya sin el vuelto)
  const pagos = [];
  const cashRow = o.pagos.find(r => r.monto > 0 && metodo(r.metodoId).efectivo);
  o.pagos.filter(r => r.monto > 0 && !metodo(r.metodoId).efectivo).forEach(r => pagos.push({ metodoId: r.metodoId, nombre: metodo(r.metodoId).nombre, monto: r.monto, ts }));
  if (cashRow && ev.applied > 0) pagos.unshift({ metodoId: cashRow.metodoId, nombre: metodo(cashRow.metodoId).nombre, monto: ev.applied, ts });
  pagos.forEach(p => cajaPush(p.metodoId, p.monto, 'cobro', 'Ticket #' + nro, ts));
  const ajuste = o.ajuste ? { tipo: o.ajuste.tipo, valor: o.ajuste.valor || 0, motivo: o.ajuste.motivo, nota: String(o.ajuste.nota || '').trim(), descuento } : null;
  const turnoIds = lineas.filter(l => l.turnoId).map(l => l.turnoId);
  DB.ventas.push({ id: ventaId, nro, ts, destino: o.mesaNombre || 'Mostrador', items: lineas, subtotal, descuento, ajuste, total, pagos: abonos.map(a => ({ ...a })).concat(pagos), recibido: ev.cashIn, vuelto: ev.vuelto, estado: 'ok', cliente: o.cliente || '', turnoId: turnoIds[0] || null, turnoIds });
  if (ajuste) {
    const nombres = { pct: 'descuento del ' + ajuste.valor + '%', monto: 'descuento de ' + money(ajuste.valor), final: 'total final fijado en ' + money(ajuste.valor), costo: 'vendido al costo' };
    logPush('descuento', '#' + nro, `Ticket #${nro}: ${nombres[ajuste.tipo]}. Subtotal ${money(subtotal)}, descuento ${money(descuento)}, total ${money(total)}. Motivo: ${ajuste.motivo}${ajuste.nota ? ' (' + ajuste.nota + ')' : ''}`, ajuste);
  }
  return ventaId;
}

/* Pagos parciales: sirven igual para cuentas (mesa, barra, mostrador) y para turnos */
function cuentaGuardada(key) {
  if (key.startsWith('T:')) {
    const t = DB.turnos.find(x => x.id === key.slice(2));
    if (!t || t.estado !== 'reservado') throw new Error('Ese turno ya no está abierto');
    return { obj: t, total: t.precio, titulo: 'Turno ' + cancha(t.canchaId).nombre };
  }
  const c = DB.comandas[key];
  if (!c || !c.items.length) throw new Error('La cuenta está vacía');
  return { obj: c, total: totalItems(c.items), titulo: lugarNombre(key) };
}
function registrarAbono(key, rows) {
  const cu = cuentaGuardada(key);
  const filas = rows.filter(r => r.monto > 0), t = sum(filas, r => r.monto), saldo = cu.total - pagadoDe(cu.obj);
  if (t <= 0) throw new Error('Poné un monto mayor a cero');
  if (t >= saldo) throw new Error('Ese monto cubre todo el saldo: usá "Confirmar cobro"');
  const nuevos = filas.map(r => ({ id: uid('pg'), ts: Date.now(), metodoId: r.metodoId, nombre: metodo(r.metodoId).nombre, monto: r.monto }));
  cu.obj.pagos = pagosDe(cu.obj).concat(nuevos);
  nuevos.forEach(p => cajaPush(p.metodoId, p.monto, 'cobro', 'Pago parcial · ' + cu.titulo));
}
/* La devolución puede hacerse en un medio distinto al que se pagó (pagó con QR, se devuelve en efectivo) */
function devolverPago(key, pagoId, metodoId) {
  const cu = cuentaGuardada(key), p = pagosDe(cu.obj).find(x => x.id === pagoId);
  if (!p) throw new Error('Ese pago ya no está en la cuenta');
  cu.obj.pagos = cu.obj.pagos.filter(x => x.id !== pagoId);
  cajaPush(metodoId, -p.monto, 'devolucion', `Devolución (${cu.titulo}) · había pagado con ${p.nombre}`);
  logPush('devolucion', cu.titulo, `Se devolvieron ${money(p.monto)} en ${metodo(metodoId).nombre} (había pagado con ${p.nombre}) · ${cu.titulo}`);
}
/* Corregir un ticket ya cobrado: sólo el medio de pago real y la nota. Cambiar productos o importes se hace anulando. */
function corregirVenta(id, o) {
  const v = DB.ventas.find(x => x.id === id);
  if (!v || v.estado !== 'ok') throw new Error('Ese ticket no se puede corregir');
  if (!o.motivo) throw new Error('Poné el motivo de la corrección');
  const cambios = [];
  v.pagos.forEach((p, i) => {
    const nuevo = o.medios[i];
    if (!nuevo || nuevo === p.metodoId) return;
    const m = metodo(nuevo);
    cajaPush(p.metodoId, -p.monto, 'correccion', `Ticket #${v.nro} corregido (sale de ${p.nombre})`, p.ts || v.ts);
    cajaPush(nuevo, p.monto, 'correccion', `Ticket #${v.nro} corregido (pasa a ${m.nombre})`, p.ts || v.ts);
    cambios.push(`${money(p.monto)}: ${p.nombre} → ${m.nombre}`);
    p.metodoId = nuevo; p.nombre = m.nombre;
  });
  if ((o.nota || '') !== (v.nota || '')) { cambios.push(`nota: "${v.nota || ''}" → "${o.nota || ''}"`); v.nota = o.nota || ''; }
  if (!cambios.length) throw new Error('No hay cambios para guardar');
  v.corregido = true;
  logPush('correccion', '#' + v.nro, `Ticket #${v.nro} corregido. ${cambios.join('; ')}. Motivo: ${o.motivo}`, { cambios, motivo: o.motivo });
}
function anularVenta(id, map) {
  const v = DB.ventas.find(x => x.id === id);
  if (!v || v.estado !== 'ok') throw new Error('Ese ticket ya está anulado');
  DB.movimientos.filter(m => m.ref === id && m.tipo === 'venta').forEach(m => moverStock(m.prodId, -m.cant, 'anulacion', { ref: id, permitirNegativo: true, motivo: `Anulación ticket #${v.nro}` }));
  const devs = v.pagos.map((p, i) => {

/* Turnos de cancha. Regla fija del sistema: Fútbol 7 usa las dos canchas de Fútbol 5, así que si hay un F5 (cualquiera de los dos) no hay F7, y si hay F7 no hay F5.
   Las dos de pádel son independientes. */
const CLAVES_F5 = ['f5a', 'f5b'];
const relacionadas = (a, b) => a.id === b.id || (a.clave === 'f7' && CLAVES_F5.includes(b.clave)) || (b.clave === 'f7' && CLAVES_F5.includes(a.clave));

/* Turnos FIJOS: se repiten todas las semanas (mismo día y hora, precio de fijo, sin seña). Cada fecha aparece como una
   "ocurrencia"; sólo se guarda un turno real cuando pasa algo ese día (se cobra, se suspende o se pospone). */
function ocurrenciasFijas(fecha) {
  const dow = dowDe(fecha);
  return DB.fijos.filter(f => f.dow === dow && f.desde <= fecha && (!f.hasta || fecha <= f.hasta) && !DB.turnos.some(t => t.fijoId === f.id && t.ocurrencia === fecha)).map(f => {
    const c = cancha(f.canchaId);
    return { virtual: true, id: 'F:' + f.id + ':' + fecha, fijoId: f.id, canchaId: f.canchaId, fecha, ini: f.ini, fin: f.ini + c.dur, cliente: f.cliente, tel: f.tel, nota: f.nota, precio: c.precioFijo, estado: 'reservado', pagos: [], esFijo: true, ocurrencia: fecha };
  });
}
const turnosDelDia = fecha => DB.turnos.filter(t => t.fecha === fecha && t.estado !== 'cancelado').concat(ocurrenciasFijas(fecha));
function turnoPorId(id) {
  if (id.startsWith('F:')) { const [, fid, fecha] = id.split(':'); return ocurrenciasFijas(fecha).find(t => t.fijoId === fid) || null; }
  return DB.turnos.find(t => t.id === id) || null;
}
function ocupante(canchaId, fecha, ini, fin, ignorar) {
  const c = cancha(canchaId);
  return turnosDelDia(fecha).find(t => t.ini < fin && ini < t.fin && relacionadas(c, cancha(t.canchaId)) &&
    !(ignorar && (t.id === ignorar.id || (t.fijoId && t.fijoId === ignorar.fijoId && t.ocurrencia && t.ocurrencia === ignorar.ocurrencia))));
}
function slotsDe(c) { const out = []; for (let s = c.ap; s + c.dur <= c.ci; s += c.dur) out.push(s); return out; }
function crearTurno(o) {
  const c = cancha(o.canchaId);
  if (!c) throw new Error('La cancha no existe');
  const fin = o.ini + c.dur, oc = ocupante(c.id, o.fecha, o.ini, fin);
  if (oc) throw new Error('Ese horario ya está ocupado por ' + cancha(oc.canchaId).nombre + ' (' + (oc.cliente || 'sin nombre') + ')');
  const precio = o.fijo ? c.precioFijo : c.precio;
  if (!(precio > 0)) throw new Error('La cancha no tiene precio cargado (Admin → Canchas y turnos)');
  const filas = (o.pagos || []).filter(r => r.monto > 0), sena = sum(filas, r => r.monto);
  if (o.fijo && sena > 0) throw new Error('Los turnos fijos no llevan seña');
  if (sena >= precio) throw new Error('La seña tiene que ser menor al precio. Para pagar todo, reservá y cobrá el turno.');
  const t = { id: uid('t'), canchaId: c.id, fecha: o.fecha, ini: o.ini, fin, cliente: o.cliente || '', tel: o.tel || '', nota: o.nota || '', precio, estado: 'reservado', pagos: [], ventaId: null, esFijo: !!o.fijo, fijoId: o.fijoId || null };
  DB.turnos.push(t);
  filas.forEach(r => {
    t.pagos.push({ id: uid('pg'), ts: o.ts || Date.now(), metodoId: r.metodoId, nombre: metodo(r.metodoId).nombre, monto: r.monto });
    cajaPush(r.metodoId, r.monto, 'cobro', 'Seña · Turno ' + c.nombre, o.ts);
  });
  return t.id;
}
function crearFijo(o) {
  const c = cancha(o.canchaId);
  const choques = [];
  for (let i = 0; i < 12; i++) { const f = sumarDias(o.fecha, 7 * i); if (ocupante(c.id, f, o.ini, o.ini + c.dur)) choques.push(f.slice(8) + '/' + f.slice(5, 7)); }
  if (choques.length) throw new Error('Choca con otros turnos el ' + choques.join(', ') + '. Liberá esos horarios antes de crear el fijo.');
  const f = { id: uid('fx'), canchaId: c.id, dow: dowDe(o.fecha), ini: o.ini, cliente: o.cliente || '', tel: o.tel || '', nota: o.nota || '', desde: o.fecha, hasta: null };
  DB.fijos.push(f);
  logPush('turno', c.nombre, `Turno FIJO creado: ${f.cliente || 'sin nombre'}, ${c.nombre}, todos los ${DIAS[f.dow]} a las ${hm(f.ini)} (desde el ${o.fecha})`);
  return f.id;
}
function materializarFijo(fijoId, fecha) {
  const existente = DB.turnos.find(t => t.fijoId === fijoId && t.ocurrencia === fecha);
  if (existente) return existente;
  const f = DB.fijos.find(x => x.id === fijoId), c = cancha(f.canchaId);
  const t = { id: uid('t'), canchaId: f.canchaId, fecha, ini: f.ini, fin: f.ini + c.dur, cliente: f.cliente, tel: f.tel, nota: f.nota, precio: c.precioFijo, estado: 'reservado', pagos: [], ventaId: null, esFijo: true, fijoId, ocurrencia: fecha };
  DB.turnos.push(t);
  return t;
}
/* Dentro de una transacción: devuelve el turno real, creándolo si era una ocurrencia de un fijo */
function turnoReal(id) {
  if (id.startsWith('F:')) { const [, fid, fecha] = id.split(':'); return materializarFijo(fid, fecha); }
  const t = DB.turnos.find(x => x.id === id);
  if (!t) throw new Error('El turno ya no existe');
  return t;
}
function suspenderOcurrencia(id) {
  const t = turnoReal(id);
  if (t.estado !== 'reservado') throw new Error('Ese turno ya no está abierto');
  if (cuentaDe(t)) throw new Error('El turno está en una cuenta abierta: sacalo de la cuenta primero');
  t.estado = 'cancelado';
  logPush('turno', cancha(t.canchaId).nombre, `Turno fijo de ${t.cliente || 'sin nombre'} suspendido el ${t.fecha} (${cancha(t.canchaId).nombre}, ${hm(t.ini)}). El horario quedó libre ese día.`);

function posponerOcurrencia(id, fecha, ini) {
  const t = turnoReal(id), c = cancha(t.canchaId);
  if (t.estado !== 'reservado') throw new Error('Ese turno ya no está abierto');
  if (cuentaDe(t)) throw new Error('El turno está en una cuenta abierta: sacalo de la cuenta primero');
  t.estado = 'cancelado';
  const nid = crearTurno({ canchaId: t.canchaId, fecha, ini, cliente: t.cliente, tel: t.tel, nota: t.nota, fijo: true, fijoId: t.fijoId });
  logPush('turno', c.nombre, `Turno de ${t.cliente || 'sin nombre'} pospuesto: del ${t.fecha} ${hm(t.ini)} al ${fecha} ${hm(ini)} (${c.nombre}).`);
  return nid;
}
function terminarFijo(fijoId, desdeFecha) {
  const f = DB.fijos.find(x => x.id === fijoId);
  if (!f) throw new Error('El turno fijo no existe');
  f.hasta = sumarDias(desdeFecha, -1);
  logPush('turno', cancha(f.canchaId).nombre, `Turno FIJO terminado: ${f.cliente || 'sin nombre'}, ${cancha(f.canchaId).nombre}, ${DIAS[f.dow]} ${hm(f.ini)}. Libre desde el ${desdeFecha}.`);
}
function cancelarTurno(id, map) {
  const t = DB.turnos.find(x => x.id === id);
  if (!t || t.estado !== 'reservado') throw new Error('Ese turno no se puede cancelar');
  if (cuentaDe(t)) throw new Error('El turno está en una cuenta abierta: sacalo de la cuenta primero');
  pagosDe(t).slice().forEach((p, i) => devolverPago('T:' + id, p.id, (map && map[i]) || p.metodoId));
  t.estado = 'cancelado';
  logPush('turno', cancha(t.canchaId).nombre, `Turno cancelado: ${t.cliente || 'sin nombre'}, ${cancha(t.canchaId).nombre}, ${t.fecha} ${hm(t.ini)}.`);
}

/* Cada cancha tiene un lugar en el mapa donde se abre la cuenta de lo que consumen mientras juegan.
   Fútbol 7 usa los lugares de las dos de Fútbol 5. Cuando el turno termina y la cuenta sigue abierta,
   sale de la cancha y pasa a una "mesa suelta" (ej: "PÁDEL 1 20:00hs") para que la cancha quede libre. */
function lugaresDeTurno(t) {
  const c = cancha(t.canchaId), ids = new Set();
  if (c.lugarId) ids.add(c.lugarId);
  if (c.clave === 'f7') DB.canchas.filter(x => CLAVES_F5.includes(x.clave)).forEach(x => { if (x.lugarId) ids.add(x.lugarId); });
  return [...ids];
}
function turnoEnCurso(lugarId, ahoraMs) {
  const d = new Date(ahoraMs), min = d.getHours() * 60 + d.getMinutes();
  return turnosDelDia(dayKey(ahoraMs)).find(t => t.ini <= min && min < t.fin && lugaresDeTurno(t).includes(lugarId));
}
const turnoFinTs = t => new Date(t.fecha + 'T00:00:00').getTime() + t.fin * 60000;
function limpiarTemporales() {
  const antes = DB.mesas.length;
  DB.mesas = DB.mesas.filter(m => !m.temporal || DB.comandas[m.id]);
  return DB.mesas.length !== antes;
}
/* Devuelve las cuentas que se movieron. Se llama al mostrar pantallas y cada 30 segundos. */
function moverTerminados() {
  const ahora = Date.now();
  const hay = Object.keys(DB.comandas).some(k => { const c = DB.comandas[k]; return k !== 'M' && c.turnoFin && ahora >= c.turnoFin && c.items.length && DB.canchas.some(cn => cn.lugarId === k); }) || DB.mesas.some(m => m.temporal && !DB.comandas[m.id]);
  if (!hay) return [];
  const r = tx(() => {
    const movidas = [];
    Object.keys(DB.comandas).forEach(k => {
      const c = DB.comandas[k], m = DB.mesas.find(x => x.id === k);
      if (k === 'M' || !m || m.temporal || !c.turnoFin || ahora < c.turnoFin || !c.items.length || !DB.canchas.some(cn => cn.lugarId === k)) return;
      const nm = { id: uid('m'), nombre: `${m.nombre} ${c.turnoLabel}hs`, tipo: 'mesa', temporal: true, x: 0, y: 0, w: 10, h: 10, rapido: false };
      DB.mesas.push(nm);
      const { turnoFin, turnoLabel, turnoCliente, ...resto } = c;
      DB.comandas[nm.id] = { ...resto, turnoCliente };
      delete DB.comandas[k];
      if (UI.com === k) UI.com = nm.id;
      logPush('turno', m.nombre, `Terminó el turno de ${turnoCliente || 'la cancha'} en ${m.nombre} (${turnoLabel}hs): la cuenta abierta pasó a la mesa suelta "${nm.nombre}" y la cancha quedó libre.`);
      movidas.push({ de: m.nombre, a: nm.nombre });

    return movidas;

}
/* Cuando empieza un turno, su costo se carga solo en la cuenta del lugar de la cancha; ahí se suman los consumos.
   Al terminar, la cuenta sale de la cancha y se sienta en una mesa (o se cobra). El turno y la cuenta quedan siempre juntos. */
const cuentaDe = t => Object.keys(DB.comandas).find(k => DB.comandas[k].items.some(i => i.turnoId === t.id)) || null;
function adjuntarTurnos() {
  const ahora = Date.now(), d = new Date(ahora), min = d.getHours() * 60 + d.getMinutes(), hoy = dayKey(ahora);
  const pend = turnosDelDia(hoy).filter(t => {
    const c = cancha(t.canchaId);
    return t.estado === 'reservado' && !t.aparte && t.ini <= min && min < t.fin && c && c.lugarId && DB.mesas.some(m => m.id === c.lugarId) && (t.virtual || !cuentaDe(t));
  });
  if (!pend.length) return [];
  const r = tx(() => {
    const hecho = [];
    pend.forEach(t0 => {
      const t = t0.virtual ? materializarFijo(t0.fijoId, t0.fecha) : t0, c = cancha(t.canchaId);
      const com = DB.comandas[c.lugarId] || (DB.comandas[c.lugarId] = { items: [], ts: Date.now() });
      com.items.unshift({ turnoId: t.id, cant: 1, nota: '' });
      com.pagos = pagosDe(com).concat(t.pagos || []); t.pagos = [];     // la seña pasa a la cuenta
      com.turnoFin = turnoFinTs(t); com.turnoLabel = hm(t.ini); com.turnoCliente = t.cliente;
      hecho.push({ cliente: t.cliente, lugar: DB.mesas.find(m => m.id === c.lugarId).nombre, precio: t.precio });
    });
    return hecho;
  });
  return r.ok ? r.value : [];
}
/* Sacar el turno de la cuenta: porque no se jugó (se suspende) o porque se va a cobrar aparte */
function quitarTurnoDeCuenta(key, turnoId, suspender) {
  const c = DB.comandas[key], t = DB.turnos.find(x => x.id === turnoId);
  if (!c || !t) throw new Error('No se encontró el turno en la cuenta');
  const nuevos = c.items.filter(i => i.turnoId !== turnoId);
  if (pagadoDe(c) > totalItems(nuevos)) throw new Error(`Ya pagaron ${money(pagadoDe(c))}: primero devolvé un pago de la cuenta`);
  setItems(key, nuevos);
  if (suspender) { t.estado = 'cancelado'; logPush('turno', nombreTurno(t), `Turno no jugado: ${nombreTurno(t)} (${t.cliente || 'sin nombre'}) se sacó de la cuenta y se suspendió.`); }
  else { t.aparte = true; logPush('turno', nombreTurno(t), `El turno ${nombreTurno(t)} (${t.cliente || 'sin nombre'}) se sacó de la cuenta para cobrarlo aparte.`); }
}
function revisarTurnos() {
  const mv = moverTerminados(), ad = adjuntarTurnos();
  mv.forEach(m => toast(`Terminó el turno en ${m.de}: la cuenta (con el costo del turno) salió de la cancha. Falta sentarlos en una mesa o cobrar.`, 'warn'));
  ad.forEach(a => toast(`Empezó el turno de ${a.cliente || 'la cancha'} en ${a.lugar}: el costo (${money(a.precio)}) ya está en la cuenta`));
  return mv.length > 0 || ad.length > 0;

const getCom = key => key === 'M' ? (DB.comandas.M || (DB.comandas.M = { items: [] })) : (DB.comandas[key] || { items: [] });
/* Una cuenta puede llevar, además de productos, líneas de TURNO ({ turnoId }): el costo del turno va adentro de la cuenta */
const totalItems = items => sum(items, it => {
  if (it.turnoId) { const t = DB.turnos.find(x => x.id === it.turnoId); return t ? t.precio : 0; }
  const p = prod(it.prodId); return p ? p.precio * it.cant : 0;
});
const pagosDe = c => c.pagos || [];
const pagadoDe = c => sum(pagosDe(c), p => p.monto);
const saldoDe = c => totalItems(c.items) - pagadoDe(c);
function setItems(key, items, neg) {
  items = items.filter(i => i.cant > 0 && (i.turnoId || prod(i.prodId)));
  if (key !== 'M' && !items.length) { delete DB.comandas[key]; return; }
  const prev = DB.comandas[key] || {};
  const nuevo = { ...prev, items, ts: prev.ts || Date.now(), negOk: prev.negOk || !!neg || undefined };
  if (!prev.items) {   // cuenta nueva: si hay un turno jugándose en ese lugar, la cuenta queda atada a él
    const t = turnoEnCurso(key, Date.now());
    if (t) { nuevo.turnoFin = turnoFinTs(t); nuevo.turnoLabel = hm(t.ini); nuevo.turnoCliente = t.cliente; }
  }
  DB.comandas[key] = nuevo;
}
function aplicarItems(key, items, neg) {
  const pag = pagadoDe(getCom(key));
  if (pag > 0 && totalItems(items) < pag) return toast(`No se puede: ya pagaron ${money(pag)}. Primero devolvé un pago.`, 'warn');
  const r = tx(() => setItems(key, items, neg));
  if (!r.ok) return;
  if (neg) toast('Se vende igual: el stock va a quedar en negativo hasta que cargues la mercadería.', 'warn', 'neg');
  else avisoBajo(items);
  if (UI.view === 'venta') { renderGrid(); renderCart(); }
  renderSide();
}
function avisoBajo(items) {
  const need = consumoItems(items), res = reservadoOtros('__nada__');
  const bajos = Object.keys(need).map(id => prod(id)).filter(p => p && p.stock - (res[p.id] || 0) <= p.minimo);
  if (!bajos.length) return;
  toast(bajos.map(p => { const r = Math.max(0, p.stock - (res[p.id] || 0)); return r === 0 ? `No queda ${p.nombre} (según el sistema)` : `Quedan ${r} de ${p.nombre}`; }).join(' · '), 'warn', 'stock');

function chequearStock(nuevo, key, conReservas, cuando, onOk) {

  if (P.ajuste) { try { desc = Math.min(P.subtotal, calcDescuento(P.subtotal, P.lineas, P.ajuste)); } catch (e) { err = e.message; } }
  P.descuento = desc; P.total = P.subtotal - desc; P.saldo = P.total - P.ya; P.ajusteErr = err;
  if (!err && P.saldo < 0) P.ajusteErr = `El total no puede quedar por debajo de lo ya pagado (${money(P.ya)}).`;
  if (P.rows.length === 1) { P.rows[0].monto = Math.max(0, P.saldo); const inp = $('#pg-0'); if (inp) inp.value = P.rows[0].monto || ''; }
  pintarTotalesCobro();

}
function updateCobro() {

/* ---------- ticket ---------- */
function ticketTexto(v) {
  const W = 36, line = '-'.repeat(W);
  const ctr = s => ' '.repeat(Math.max(0, Math.floor((W - s.length) / 2))) + s;
  const m = n => money(n).replace(/\s/g, '');
  const lr = (a, b) => a.slice(0, Math.max(1, W - b.length - 1)).padEnd(W - b.length) + b;
  const L = [ctr(DB.negocio.toUpperCase()), ctr('Ticket no fiscal'), line,
    lr('Ticket Nº ' + String(v.nro).padStart(5, '0'), fechaHora(v.ts)), 'Destino: ' + v.destino];
  if (v.cliente) L.push('Cliente: ' + v.cliente);
  if (v.estado !== 'ok') L.push('*** ANULADO ***');
  L.push(line);
  v.items.forEach(l => {
    L.push(lr(`${l.cant} x ${l.nombre}`, m(l.cant * l.precio)));
    if (l.nota) L.push('   (' + l.nota + ')');
  });
  L.push(line);
  if (v.descuento > 0) { L.push(lr('Subtotal', m(v.subtotal))); L.push(lr('Descuento', '-' + m(v.descuento))); L.push('  (' + v.ajuste.motivo + ')'); }
  L.push(lr('TOTAL', m(v.total)));
  v.pagos.forEach(p => L.push(lr('  ' + p.nombre + (p.ts && Math.abs(p.ts - v.ts) > 60000 ? ' (' + hhmm(p.ts) + ')' : ''), m(p.monto))));
  if (v.vuelto > 0) L.push(lr('  Vuelto', m(v.vuelto)));
  L.push(line, ctr('¡Gracias por venir!'));
  return L.join('\n');
}
function verTicket(id, nuevo) {
  const v = DB.ventas.find(x => x.id === id); if (!v) return;
  const txt = ticketTexto(v);
  const acciones = [{ label: 'Cerrar', kind: nuevo ? 'primary' : '' }];
  acciones.unshift({ label: 'Copiar texto', onClick: () => { copiar(txt); return false; } }, { label: 'Reimprimir / PDF', onClick: () => { imprimir(); return false; } });
  if (!nuevo && v.estado === 'ok') acciones.unshift({ label: 'Anular ticket', kind: 'danger', onClick: () => { anularTicket(id); return false; } }, { label: 'Corregir ticket', onClick: () => { corregirTicket(id); return false; } });
  const aviso = (v.ajuste ? `<div class="note warn">Ticket con ajuste: <b>${esc(v.ajuste.motivo)}</b>${v.ajuste.nota ? ' · ' + esc(v.ajuste.nota) : ''} (descuento ${money(v.descuento)}).</div>` : '') + (v.corregido ? '<div class="note">Este ticket fue corregido. Los cambios están en el registro de cambios (Admin).</div>' : '');
  modal({ title: nuevo ? `Venta registrada · Ticket #${v.nro}` : `Ticket #${v.nro}`, body: `${aviso}<pre class="paper" id="ticket-paper">${esc(txt)}</pre>
    <p class="muted" style="font-size:12px">Todos los datos del ticket quedan guardados: se puede reimprimir o volver a generar el PDF cuando haga falta.</p>`, actions: acciones });
}
function imprimir() {
  try { window.print(); } catch (e) { /* sin impresión en este entorno */ }
  toast('En la versión real el PDF se guarda solo en la carpeta oculta. Acá se usa la impresión del navegador (puede no abrirse en la vista previa).', 'warn');
}
function anularTicket(id) {

        ${v.pagos.map((p, i) => `<div class="drow"><span><b>${money(p.monto)}</b><br><small class="muted">figura como ${esc(p.nombre)}</small></span><label class="fld">Cobrado realmente con<select class="in" id="co-${i}">${opts(p.metodoId)}</select></label></div>`).join('')}

function slotHTML(c, s, fecha, ap, hoy, ahora) {

/* ---------- carga de stock por foto de remito (la lectura es SIMULADA en el prototipo) ---------- */
const REMITO_EJEMPLO = [
  { texto: 'COCA COLA 500CC BULTO 6X12', cant: 2 }, { texto: 'SALCHICHA VIENA PAQ X6', cant: 3 },
  { texto: 'PAN PANCHO X6', cant: 4 }, { texto: 'ALFAJOR TRIPLE CJ X24', cant: 1 }, { texto: 'SERVILLETAS PAPEL X500', cant: 2 },
];
function adivinarProducto(texto) {
  const ruido = ['paq', 'caj', 'cja', 'bulto', 'cj', 'una', 'con', 'los'];
  const pal = norm(texto).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !/^x?\d/.test(w) && !ruido.includes(w));
  let best = null, score = 0;
  DB.productos.filter(p => p.tipo !== 'servicio' && p.tipo !== 'receta').forEach(p => {
    const nom = norm(p.nombre), sc = pal.filter(w => nom.includes(w.slice(0, 5))).length;
    if (sc > score) { score = sc; best = p; }
  });
  return best;
}
function modalFoto() {
  modal({
    title: 'Cargar stock con foto del remito',
    body: `<div class="note warn"><b>Lectura simulada.</b> En este prototipo no se lee la foto de verdad: al tocar "Leer remito" aparece un remito de ejemplo para que veas el recorrido. En la versión real una IA lee el texto de la foto, y vos revisás todo antes de que se cargue algo.</div>
      <label class="fld">Foto del remito o factura<input class="in" type="file" id="foto-file" accept="image/*" data-in="foto-file"></label><div id="foto-prev"></div>`,
    actions: [{ label: 'Cancelar' }, { label: 'Leer remito', kind: 'primary', onClick: () => {
      UI.foto = REMITO_EJEMPLO.map(r => { const p = adivinarProducto(r.texto); return { texto: r.texto, cant: r.cant, prodId: p ? p.id : '', modo: p && p.paqueteUnidades > 1 ? 'paq' : 'uni' }; });
      revisarFoto(); return false;
    } }],
  });
}
function revisarFoto() {
  const opts = id => `<option value="">— no cargar —</option>` + DB.productos.filter(p => p.tipo !== 'servicio' && p.tipo !== 'receta').map(p => `<option value="${p.id}" ${p.id === id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
  const filas = UI.foto.map((f, i) => `<div class="frow"><code>${esc(f.texto)}</code>
    <select class="in" id="foto-p-${i}" data-in="foto-row">${opts(f.prodId)}</select>
    <input class="in" id="foto-c-${i}" data-in="foto-row" inputmode="numeric" value="${f.cant}" aria-label="Cantidad">
    <select class="in" id="foto-m-${i}" data-in="foto-row"><option value="paq" ${f.modo === 'paq' ? 'selected' : ''}>paquetes</option><option value="uni" ${f.modo === 'uni' ? 'selected' : ''}>unidades</option></select>
    <span class="pill" id="foto-r-${i}"></span></div>`).join('');
  modal({
    title: 'Revisá lo que leyó antes de cargar', wide: true,
    body: `<p class="muted">A la izquierda, lo que dice el remito. Corregí el producto o la cantidad si algo no coincide. Lo que quede en "no cargar" se ignora.</p>${filas}`,
    actions: [{ label: 'Cancelar' }, { label: 'Cargar al stock', kind: 'primary', onClick: () => {
      const lista = UI.foto.map((f, i) => ({ f, id: $('#foto-p-' + i).value, u: unidadesFoto(i) })).filter(x => x.id && x.u > 0);
      if (!lista.length) { toast('No hay renglones para cargar', 'warn'); return false; }
      const r = tx(() => lista.forEach(x => moverStock(x.id, x.u, 'ingreso', { motivo: 'Remito (foto): ' + x.f.texto })));
      if (r.ok) { toast(`Se cargaron ${lista.length} productos al stock`); render(); }
    } }],
  });
  UI.foto.forEach((_, i) => fotoResumen(i));
}
function unidadesFoto(i) {
  const id = $('#foto-p-' + i).value, p = id && prod(id); if (!p) return 0;

}

  const el = $('#foto-r-' + i), id = $('#foto-p-' + i).value, u = unidadesFoto(i);

/* --- REPORTES --- */
function ventasRango(d, h) { return DB.ventas.filter(v => v.estado === 'ok' && dayKey(v.ts) >= d && dayKey(v.ts) <= h); }
/* Lo cobrado en el período por medio de pago, según el libro de caja: cobros (con pagos parciales y señas) menos devoluciones */
function cobros(d, h) {
  const m = {}; DB.metodos.forEach(x => { m[x.id] = { nombre: x.nombre, n: 0, monto: 0 }; });
  DB.caja.forEach(e => {
    const k = dayKey(e.ts); if (k < d || k > h) return;
    const o = m[e.metodoId] || (m[e.metodoId] = { nombre: e.nombre, n: 0, monto: 0 });
    if (e.tipo === 'cobro') o.n++;
    o.monto += e.monto;
  });
  return Object.values(m);
}
function resumen(d, h) {
  const vs = ventasRango(d, h), total = sum(vs, v => v.total);
  const met = cobros(d, h);
  const cats = {}, prods = {};
  vs.forEach(v => v.items.forEach(l => {
    const cn = catDe(l.catId) ? catDe(l.catId).nombre : 'Sin categoría';
    cats[cn] = (cats[cn] || 0) + l.cant * l.precio;
    if (l.prodId) { const o = prods[l.nombre] || (prods[l.nombre] = { cant: 0, monto: 0 }); o.cant += l.cant; o.monto += l.cant * l.precio; }
  }));
  return { vs, total, met, cobrado: sum(met, m => m.monto), cats: Object.entries(cats).sort((a, b) => b[1] - a[1]), prods: Object.entries(prods).sort((a, b) => b[1].cant - a[1].cant) };
}
function barras(rows, fmt) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([n, v]) => `<div class="bar"><span class="lbl" title="${esc(n)}">${esc(n)}</span><div class="track"><div class="fill" style="width:${Math.max(2, v / max * 100)}%"></div></div><span class="val">${fmt(v)}</span></div>`).join('') || '<p class="muted">Sin ventas en el período.</p>';
}

function formProducto(id) {
  const p = id ? prod(id) : null;
  UI.pf = p ? JSON.parse(JSON.stringify(p)) : { nombre: '', catId: DB.categorias[0] ? DB.categorias[0].id : '', tipo: 'directo', precio: 0, stock: 0, minimo: 0, paqueteNombre: '', paqueteUnidades: 1, receta: [], activo: true };
  UI.pfId = id || null;
  mostrarFormProducto();
}
function leerPF() {
  const f = UI.pf; if (!$('#pf-nombre')) return;
  f.nombre = $('#pf-nombre').value.trim(); f.catId = $('#pf-cat').value;
  if ($('#pf-precio')) f.precio = num($('#pf-precio').value);
  if ($('#pf-costo')) f.costo = num($('#pf-costo').value);
  if ($('#pf-min')) f.minimo = num($('#pf-min').value);
  if ($('#pf-stock')) f.stock = num($('#pf-stock').value);
  if ($('#pf-paqn')) { f.paqueteNombre = $('#pf-paqn').value.trim(); f.paqueteUnidades = Math.max(1, num($('#pf-paqu').value)); }
  if (f.tipo === 'receta') f.receta = f.receta.map((r, i) => ({ id: $('#pf-ri-' + i).value, cant: Math.max(1, num($('#pf-rc-' + i).value)) }));
}
function mostrarFormProducto() {
  const f = UI.pf, editando = !!UI.pfId, conStock = ['directo', 'insumo'].includes(f.tipo);
  const insumos = DB.productos.filter(p => (p.tipo === 'insumo' || p.tipo === 'directo') && p.id !== UI.pfId);
  const receta = f.tipo === 'receta' ? `<div class="stack"><b>Ingredientes (se descuentan al vender)</b>
    ${f.receta.map((r, i) => `<div class="rrow"><select class="in" id="pf-ri-${i}">${insumos.map(x => `<option value="${x.id}" ${x.id === r.id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select><input class="in" id="pf-rc-${i}" inputmode="numeric" value="${r.cant}" aria-label="Cantidad"><button class="icon" data-act="pf-rdel" data-i="${i}" aria-label="Quitar">×</button></div>`).join('')}

  const costoCampo = f.tipo === 'receta' ? `<div class="note">Costo calculado con los ingredientes: <b>${costoReceta(f.receta) ? money(costoReceta(f.receta)) : 'faltan los costos de algún ingrediente'}</b></div>` : `<label class="fld">Costo unitario (sólo se ve en Administración)<input class="in" id="pf-costo" inputmode="numeric" value="${f.costo || 0}"><small>Sirve para vender "al costo" a empleados y para ver el margen.</small></label>`;
  const stockCampos = conStock ? `<div class="grid2">
      ${editando ? '' : `<label class="fld">Stock inicial (unidades)<input class="in" id="pf-stock" inputmode="numeric" value="${f.stock}"></label>`}
      <label class="fld">Avisar cuando queden (mínimo)<input class="in" id="pf-min" inputmode="numeric" value="${f.minimo}"></label></div>
    <div class="grid2"><label class="fld">Cómo viene de fábrica (opcional)<input class="in" id="pf-paqn" placeholder="Ej: Bulto 6 × 12, Pack × 6" value="${esc(f.paqueteNombre)}"></label>
      <label class="fld">Unidades por paquete<input class="in" id="pf-paqu" inputmode="numeric" value="${f.paqueteUnidades}"><small>Así al cargar "4 paquetes" suma las unidades solo.</small></label></div>` : '';
  modal({
    title: editando ? 'Editar producto' : 'Nuevo producto', wide: true,
    body: `<div class="grid2"><label class="fld">Nombre<input class="in" id="pf-nombre" value="${esc(f.nombre)}" placeholder="Ej: Sprite 500 ml"></label>
      <label class="fld">Categoría<select class="in" id="pf-cat">${DB.categorias.map(c => `<option value="${c.id}" ${c.id === f.catId ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label></div>
      <div class="grid2"><label class="fld">Tipo de producto<select class="in" id="pf-tipo" data-in="pf-tipo">${Object.entries(TIPOS).map(([k, t]) => `<option value="${k}" ${k === f.tipo ? 'selected' : ''}>${t.n}</option>`).join('')}</select><small>${TIPOS[f.tipo].d}</small></label>
      ${f.tipo === 'insumo' ? '<div></div>' : `<label class="fld">Precio de venta<input class="in" id="pf-precio" inputmode="numeric" value="${f.precio}"></label>`}</div>
      ${costoCampo}${receta}${stockCampos}${editando && conStock ? '<div class="note">El stock actual no se cambia desde acá: usá "Ingreso" o "Contar" en la sección Stock para que quede registrado.</div>' : ''}`,
    actions: [{ label: 'Cancelar' }, { label: 'Guardar producto', kind: 'primary', onClick: guardarProducto }],
  });
}
function guardarProducto() {
  leerPF();
  const f = UI.pf;
  if (!f.nombre) { toast('Falta el nombre', 'warn'); return false; }
  if (f.tipo === 'receta' && !f.receta.length) { toast('Agregá al menos un ingrediente', 'warn'); return false; }
  if (f.tipo === 'receta' && new Set(f.receta.map(r => r.id)).size !== f.receta.length) { toast('Un ingrediente está repetido', 'warn'); return false; }
  if (DB.productos.some(p => p.id !== UI.pfId && norm(p.nombre) === norm(f.nombre))) { toast('Ya existe un producto con ese nombre', 'warn'); return false; }
  const r = tx(() => {
    const campos = { nombre: f.nombre, catId: f.catId, tipo: f.tipo, precio: f.tipo === 'insumo' ? 0 : f.precio, minimo: ['directo', 'insumo'].includes(f.tipo) ? f.minimo : 0, paqueteNombre: f.paqueteNombre, paqueteUnidades: f.paqueteUnidades || 1, costo: f.tipo === 'receta' ? 0 : (f.costo || 0), receta: f.tipo === 'receta' ? f.receta : [] };
    if (UI.pfId) {
      const p = prod(UI.pfId), antes = { precio: p.precio, costo: p.costo || 0 };
      Object.assign(p, campos);
      if (antes.precio !== p.precio || antes.costo !== (p.costo || 0)) logPush('precio', p.nombre, `${p.nombre}: precio ${money(antes.precio)} → ${money(p.precio)}, costo ${money(antes.costo)} → ${money(p.costo || 0)}`);
    } else {
      const p = { id: uid('p'), activo: true, stock: 0, ...campos }; DB.productos.push(p);
      if (['directo', 'insumo'].includes(p.tipo) && f.stock > 0) moverStock(p.id, f.stock, 'ingreso', { motivo: 'Stock inicial' });
    }
  });
  if (r.ok) { toast('Producto guardado'); render(); }
}
function eliminarProducto(id) {
  const p = prod(id);
  const usado = DB.productos.find(x => x.receta && x.receta.some(r => r.id === id));
  if (usado) return toast(`No se puede: "${usado.nombre}" lo usa en su receta`, 'warn');
  if (Object.values(DB.comandas).some(c => c.items.some(i => i.prodId === id))) return toast('No se puede: está en una cuenta abierta', 'warn');
  ask('Eliminar producto', `¿Eliminar <b>${esc(p.nombre)}</b>? Los tickets viejos mantienen su nombre. Si sólo querés que no aparezca en la caja, usá "Ocultar".`, 'Eliminar', () => {
    const r = tx(() => { DB.productos = DB.productos.filter(x => x.id !== id); });
    if (r.ok) { toast('Producto eliminado'); render(); }
  }, true);
}
