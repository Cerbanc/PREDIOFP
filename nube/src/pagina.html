<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14211c;--mu:#5b6b64;--ln:#dfe6e2;--ac:#0a7a5a;--bad:#b3261e;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1714;--card:#17221e;--tx:#e8f0ec;--mu:#9bb0a7;--ln:#2a3a34;--ac:#3fbf96;--bad:#ff8a80;--warn:#e3b341}}
:root[data-theme=dark]{--bg:#0f1714;--card:#17221e;--tx:#e8f0ec;--mu:#9bb0a7;--ln:#2a3a34;--ac:#3fbf96;--bad:#ff8a80;--warn:#e3b341}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h1{flex:1}
button,input,.btn{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px}
button,.btn{cursor:pointer;text-decoration:none;display:inline-block}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.k b{display:block;font-size:22px}.k span{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:600;font-size:13px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.est{font-size:14px;margin:6px 0 12px}.ok{color:var(--ac)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mu{color:var(--mu)}
.centro{max-width:340px;margin:18vh auto;text-align:center}.centro input{width:100%;margin:12px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.g2 .card{margin:0}
[hidden]{display:none!important}
:root{--hoy:#b45309;--ok-bg:#e3f4ee;--bad-bg:#fdecea;--warn-bg:#fff4d6;--warn-tx:#7a5200;--sobre:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--hoy:#f5b84a;--ok-bg:#16332a;--bad-bg:#3a1d1b;--warn-bg:#3a2e0f;--warn-tx:#e3b341;--sobre:#06241b}}
:root[data-theme=dark]{--hoy:#f5b84a;--ok-bg:#16332a;--bad-bg:#3a1d1b;--warn-bg:#3a2e0f;--warn-tx:#e3b341;--sobre:#06241b}
.pri{color:var(--sobre)}button,.btn{min-height:44px}button:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top a.mu{padding:12px 6px}@media(max-width:520px){.top h1{flex:1 1 100%}.top a.mu{margin-left:auto}}button:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--mu);padding:9px 4px}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--sobre)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:10px}.nav button{min-width:48px}
.mid{flex:1;min-width:0;text-align:center}.mid>input{width:100%;min-height:44px}.per{font-weight:700;font-size:17px;line-height:1.25}
.rng{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.rng label{display:flex;flex-direction:column;align-items:flex-start;font-size:13px;color:var(--mu);flex:1;min-width:130px}.rng input{width:100%;min-height:44px;color:var(--tx)}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.alerta{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}.alerta b{color:var(--warn-tx)}
.kpis.p{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.p .k b{font-size:clamp(17px,5.2vw,22px);overflow-wrap:anywhere}.kpis.p .k:first-child{grid-column:1/-1}.kpis.p .k:first-child b{font-size:clamp(22px,7.4vw,28px)}
@media(min-width:760px){.kpis.p{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis.p .k:first-child{grid-column:auto}.kpis.p .k b,.kpis.p .k:first-child b{font-size:19px;overflow-wrap:normal}}
.dl{display:block;font-size:13px;margin-top:2px;color:var(--mu)}.dl.up{color:var(--ac)}.dl.down{color:var(--bad)}
.nota{font-size:13px;margin:8px 2px 12px}.sp{height:12px}
.graf{width:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:8px}.graf:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.graf text{fill:var(--mu);font:11px system-ui,sans-serif}.graf text.v{fill:var(--tx);font-weight:600}.graf text.hoy{fill:var(--hoy);font-weight:700}
.graf .gr{stroke:var(--ln);stroke-width:1}.graf .bar{fill:var(--ac)}.graf .bar.hoy{fill:var(--hoy)}.graf .bar.vacia{fill:var(--mu)}
.graf .rayas{fill:url(#rayas);stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3}.graf .sombra{fill:var(--ln);opacity:0}.graf .col.sel .sombra{opacity:.6}.graf .col.sel .bar{stroke:var(--tx);stroke-width:2}
.det{min-height:48px;padding:8px 2px 2px;font-size:15px}.det button{margin-left:6px;padding:6px 12px;min-height:40px}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-top:6px}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:var(--ac)}
.sw.h{background:var(--hoy)}.sw.f{background:repeating-linear-gradient(45deg,var(--mu) 0 1.5px,transparent 1.5px 5px);border:1px dashed var(--mu)}
.k3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.k3 .k b{font-size:18px}.k3 .k:nth-child(3):last-child{grid-column:1/-1}
@media(min-width:600px){.k3{grid-template-columns:repeat(3,1fr)}.k3 .k:nth-child(3):last-child{grid-column:auto}}
.cierres{list-style:none;margin:0;padding:0}.cierres li{padding:10px 0;border-bottom:1px solid var(--ln)}.cierres li:last-child{border-bottom:0}
.cl1{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.cl2{font-size:14px;margin-top:2px}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:600;border:1px solid;white-space:nowrap}
.chip.ok{color:var(--ac);background:var(--ok-bg);border-color:var(--ac)}.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}.chip.warn{color:var(--warn-tx);background:var(--warn-bg);border-color:var(--warn)}
.resu{margin:0 0 8px;font-size:16px}.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px}.chk input{width:22px;height:22px;padding:0}
details.card summary{cursor:pointer;min-height:32px;display:flex;align-items:center;font-size:15px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}details.card[open] summary{margin-bottom:8px}
td.n,th.n{white-space:nowrap}td.n.w{white-space:normal}.g2 .card p{margin:.4em 0}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start}.card{min-width:0}
@media(max-width:480px){table{font-size:14px}th,td{padding:6px 3px}}
@media(max-width:360px){table{font-size:13px}th,td{padding:5px 2px}}.resu .chip{white-space:normal}
tr.sd td{color:var(--warn)}.cargando{opacity:.5}.err{text-align:center}.err p{margin:4px 0 12px}
</style></head><body><main>
<div id="login" class="centro" hidden><h1>Reportes del Predio</h1>
<form method="post" action="/entrar"><input type="password" name="clave" placeholder="Clave" autofocus autocomplete="current-password"><button class="pri" style="width:100%">Entrar</button></form>
<p class="bad" id="mal" hidden>Clave incorrecta</p></div>
<div id="app" hidden>
<div class="top"><h1>Reportes del Predio</h1><a class="btn" href="/turnos">Turnos</a><button id="tema" title="Cambiar entre claro y oscuro">Claro / Oscuro</button><a class="mu" href="/salir">Salir</a></div>
<div class="tabs" role="tablist" aria-label="Qué período ver"><button role="tab" data-v="dia">Día</button><button role="tab" data-v="semana">Semana</button><button role="tab" data-v="mes">Mes</button><button role="tab" data-v="fechas">Fechas</button></div>
<div class="nav"><button id="ant" aria-label="Anterior" title="Anterior">←</button>
<div class="mid"><input type="date" id="fecha" aria-label="Fecha"><div class="per" id="per" hidden></div>
<div class="rng" id="rng" hidden><label>Desde<input type="date" id="d1"></label><label>Hasta<input type="date" id="d2"></label></div></div>
<button id="sig" aria-label="Siguiente" title="Siguiente">→</button></div>
<div class="top acc"><button id="hoy">Hoy</button><a class="btn pri" id="xl" href="#">Bajar Excel</a><button class="pri" id="csv" hidden>Bajar para Excel (CSV)</button></div>
<div class="est" id="est" role="status"></div><div id="cont" role="tabpanel"></div></div>
<script>
"use strict";
const DENTRO="__DENTRO__"==="1",MAL="__MAL__"==="1";
const $=s=>document.querySelector(s);
const NUM=new Intl.NumberFormat("es-AR",{useGrouping:"always",maximumFractionDigits:0});
const $$=n=>NUM.format(Math.round(n||0)+0);
const m=n=>(n<0?"− ":"")+"$\u00a0"+$$(Math.abs(n||0));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora=ts=>new Date(ts).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const pct=(v,t)=>t>0?Math.round(v/t*100)+"%":"";
const corto=v=>v>=1e6?new Intl.NumberFormat("es-AR",{maximumFractionDigits:1}).format(v/1e6)+" M":v>=1e4?$$(v/1e3)+" mil":v>=1e3?new Intl.NumberFormat("es-AR",{maximumFractionDigits:1}).format(v/1e3)+" mil":$$(v);
// ---- fechas (todo en AAAA-MM-DD, en hora de Argentina, igual que el programa del local) ----
const hoyK=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const ms=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));
const de=x=>new Date(x).toISOString().slice(0,10);
const valida=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")&&de(ms(d))===d;
const sumar=(d,k)=>de(ms(d)+k*864e5);
const cuenta=(a,b)=>Math.round((ms(b)-ms(a))/864e5)+1;
const lunesDe=d=>sumar(d,-((new Date(ms(d)).getUTCDay()+6)%7));
const iniMes=d=>d.slice(0,8)+"01";
const mesMas=(d,k)=>{const x=new Date(ms(d));return de(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+k,1))};
const finMes=d=>{const x=new Date(ms(d));return de(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0))};
const fmt=(d,o)=>new Date(ms(d)).toLocaleDateString("es-AR",{...o,timeZone:"UTC"}).replace(",","");
const larga=d=>fmt(d,{weekday:"long",day:"numeric",month:"long"});
const dm=d=>+d.slice(8)+"/"+ +d.slice(5,7);
const sem=d=>fmt(d,{weekday:"short"}).replace(".","");
const cortaF=d=>sem(d)+" "+dm(d);
const mayus=s=>s.charAt(0).toUpperCase()+s.slice(1);
const MAX_DIAS=400;
// ---- estado de la pantalla ----
let vista="dia",ref=hoyK(),desde=sumar(hoyK(),-6),hasta=hoyK(),tok=0,rz=0,abajo=false,ult=null,G=null,soloDif=false,verTodos=false;
if($("#tema")){$("#tema").onclick=()=>{const r=document.documentElement,oscuro=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=oscuro?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(e){}};}
if(!DENTRO){$("#login").hidden=false;if(MAL)$("#mal").hidden=false}else{$("#app").hidden=false;iniciar()}

function periodo(){
  if(vista==="dia")return{desde:ref,hasta:ref};
  if(vista==="semana"){const l=lunesDe(ref);return{desde:l,hasta:sumar(l,6)}}
  if(vista==="mes")return{desde:iniMes(ref),hasta:finMes(ref)};
  return{desde,hasta};
}
// El período con el que se compara: lo mismo de antes y, si el actual todavía no terminó, sólo los mismos días.
function anteriorDe(p){
  const h=hoyK(),ef=p.hasta>h?h:p.hasta;
  if(vista==="dia"||ef<p.desde)return null;
  const largo=cuenta(p.desde,ef),parcial=p.hasta>h;
  let a,b,rot;
  if(vista==="semana"){a=sumar(p.desde,-7);b=sumar(a,largo-1);rot="que la semana pasada"}
  else if(vista==="mes"){a=mesMas(p.desde,-1);const fin=finMes(a),t=sumar(a,largo-1);b=parcial&&t<fin?t:fin;rot="que el mes pasado"}
  else{const L=cuenta(p.desde,p.hasta);a=sumar(p.desde,-L);b=sumar(a,largo-1);rot=`que los ${largo} días anteriores`}
  return{desde:a,hasta:b,rot,parcial,largo};
}
function etiquetaPeriodo(p){
  if(vista==="semana"){const a=new Date(ms(p.desde)),b=new Date(ms(p.hasta));return a.getUTCMonth()===b.getUTCMonth()?`Semana del ${+p.desde.slice(8)} al ${fmt(p.hasta,{day:"numeric",month:"long"})}`:`Semana del ${fmt(p.desde,{day:"numeric",month:"long"})} al ${fmt(p.hasta,{day:"numeric",month:"long"})}`}
  return mayus(fmt(p.desde,{month:"long",year:"numeric"}));
}
function guardarHash(){
  const p=periodo(),h=hoyK(),actual=p.desde<=h&&h<=p.hasta;       // lo de hoy no lleva fecha: un favorito siempre abre lo actual
  const x=vista==="fechas"?"#fechas/"+desde+"/"+hasta:vista==="dia"?(actual?"":"#dia/"+ref):"#"+vista+(actual?"":"/"+ref);
  try{history.replaceState(null,"",location.pathname+location.search+x)}catch(e){}
}
function leerHash(){
  const p=location.hash.slice(1).split("/"),v=p[0];
  if(!["dia","semana","mes","fechas"].includes(v))return;
  vista=v;
  if(v==="fechas"){if(valida(p[1])&&valida(p[2])&&p[1]<=p[2]&&cuenta(p[1],p[2])<=MAX_DIAS){desde=p[1];hasta=p[2]}}
  else if(valida(p[1]))ref=p[1];
}
function controles(){
  const p=periodo(),h=hoyK();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===vista?"true":"false"));
  $("#fecha").hidden=vista!=="dia";$("#per").hidden=vista==="dia"||vista==="fechas";$("#rng").hidden=vista!=="fechas";
  if(vista==="dia")$("#fecha").value=ref;
  else if(vista==="fechas"){$("#d1").value=desde;$("#d2").value=hasta}
  else $("#per").textContent=etiquetaPeriodo(p);
  const sigDesde=vista==="fechas"?sumar(hasta,1):vista==="dia"?sumar(ref,1):vista==="semana"?sumar(p.hasta,1):mesMas(p.desde,1);
  $("#sig").disabled=sigDesde>h;
  const hb=$("#hoy");hb.hidden=vista==="fechas";hb.textContent=vista==="dia"?"Hoy":vista==="semana"?"Esta semana":"Este mes";
  $("#xl").hidden=vista!=="dia";$("#csv").hidden=true;
  guardarHash();
}
function ir(v){
  if(v===vista)return;
  const p=periodo(),h=hoyK();
  if(v==="fechas"){if(vista==="dia"){hasta=ref;desde=sumar(ref,-6)}else{desde=p.desde;hasta=p.hasta}}
  else if(vista==="fechas")ref=hasta>h?h:hasta;
  else if(v==="dia"&&ref>h)ref=h;
  vista=v;verTodos=false;cambiar();
}
function mover(k){
  if(vista==="dia")ref=sumar(ref,k);
  else if(vista==="semana")ref=sumar(ref,7*k);
  else if(vista==="mes")ref=mesMas(ref,k);
  else{const L=cuenta(desde,hasta);desde=sumar(desde,L*k);hasta=sumar(hasta,L*k)}
  verTodos=false;cambiar();
}
function cambiar(){controles();cargar()}
function iniciar(){
  leerHash();
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>ir(b.dataset.v));
  $("#fecha").onchange=e=>{if(valida(e.target.value)){ref=e.target.value;cambiar()}};
  const fechas=()=>{let a=$("#d1").value,b=$("#d2").value;if(!valida(a)||!valida(b))return;if(a>b){if(document.activeElement===$("#d1"))b=a;else a=b}desde=a;hasta=b;cambiar()};
  $("#d1").onchange=fechas;$("#d2").onchange=fechas;
  $("#ant").onclick=()=>mover(-1);$("#sig").onclick=()=>mover(1);
  $("#hoy").onclick=()=>{ref=hoyK();cambiar()};
  $("#csv").onclick=bajarCsv;
  addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(dibujar,150)});
  addEventListener("pointerup",()=>{abajo=false});addEventListener("pointercancel",()=>{abajo=false});
  controles();cargar();
  setInterval(()=>{if(!document.hidden&&periodo().hasta>=hoyK()&&periodo().desde<=hoyK())cargar(true)},120000);
}
function tabla(cols,filas,vacio){
  if(!filas.length)return `<p class="mu">${vacio||"Sin datos"}</p>`;
  return `<table><tr>${cols.map(c=>`<th class="${c.n?"n":""}">${c.t}</th>`).join("")}</tr>${filas.map(f=>`<tr>${cols.map(c=>`<td class="${c.n?"n":""}">${c.f(f)}</td>`).join("")}</tr>`).join("")}</table>`;
}
function falla(msg,silencioso){
  if(silencioso){$("#est").innerHTML='<span class="bad">Sin conexión: se muestran los últimos datos.</span>';return}
  $("#cont").classList.remove("cargando");$("#est").textContent="";
  $("#cont").innerHTML=`<div class="card err"><p class="bad"><b>${esc(msg)}</b></p><button id="reint">Probar de nuevo</button></div>`;
  $("#reint").onclick=()=>cargar();
}
async function pedir(ruta){
  let r;try{r=await fetch(ruta,{cache:"no-store"})}catch{throw{msg:"No hay conexión. Revisá tu internet y probá de nuevo."}}
  if(r.status===401){location.reload();throw{callar:true}}
  return r;
}
async function msgError(r){
  let t="";try{t=(await r.json()).error||""}catch{}
  return r.status>=500?"La página tuvo un problema. Probá de nuevo en un rato.":(t||"No se pudo cargar. Probá de nuevo.");
}
async function cargar(silencioso){
  const mi=++tok;
  if(!silencioso){$("#cont").classList.add("cargando");$("#est").textContent="Cargando…"}
  try{
    if(vista==="dia")await cargarDia(mi,silencioso);else await cargarPeriodo(mi,silencioso);
  }catch(e){if(mi===tok&&!e.callar)falla(e.msg||"No se pudo cargar. Probá de nuevo.",silencioso)}
}
// ---------------------------------------------------------------- un día
async function cargarDia(mi,silencioso){
  const dia=ref,x=$("#xl");x.href="/excel/"+dia;
  const r=await pedir("/api/dia/"+dia);
  if(mi!==tok)return;
  if(r.status===404){$("#est").textContent="";$("#cont").classList.remove("cargando");$("#cont").innerHTML='<div class="card"><p><b>Sin datos de este día.</b></p><p class="mu">La PC del local no subió este día (estaba apagada o sin internet) o todavía no se usó el programa. Eso no significa que no se haya vendido.</p></div>';x.hidden=true;ult=null;return}
  if(!r.ok)throw{msg:await msgError(r)};
  const {resumen:d,subido,ahora}=await r.json();
  if(mi!==tok)return;
  x.hidden=false;ult=null;
  const min=Math.max(0,Math.round((ahora-subido)/6e4));
  const viejo=dia===hoyK()&&min>35;

  for(const f of[0,.5,1]){const yy=y(tope*f);s+=`<line class="gr" x1="${L}" x2="${W-Rd}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${f?corto(tope*f):"0"}</text>`}

    const cx=L+slot*i,bx=cx+(slot-bw)/2,mid=cx+slot/2,esHoy=G.agr?(x.desde<=h&&h<=x.hasta):x.dia===h;
    s+=`<g class="col${i===G.sel?" sel":""}" data-i="${i}"><title>${esc(textoBarra(x))}</title><rect class="sombra" x="${cx}" y="${T-6}" width="${slot}" height="${H-T-B+6}" rx="4"/>`;

      const top=Math.min(y0-2,y(x.total));
      s+=`<rect class="bar${esHoy?" hoy":""}" x="${bx}" y="${top}" width="${bw}" height="${y0-top}" rx="2"/>`;
      if(slot>=40&&x.total>0)s+=`<text class="v" x="${mid}" y="${top-4}" text-anchor="middle">${corto(x.total)}</text>`;
    }
    let l=null;
    if(!G.agr&&n<=8)l=[sem(x.dia),String(+x.dia.slice(8))];
    else if(G.agr)l=i%G.paso===0?[dm(x.desde)]:null;
    else if(vista==="mes"){const d=+x.dia.slice(8);if(d===1||(d%5===0&&d<=25))l=[String(d)]}
    else if(i%G.paso===0)l=[dm(x.dia)];
    if(l)l.forEach((t,j)=>{s+=`<text class="${esHoy?"hoy":""}" x="${mid}" y="${H-B+15+j*14}" text-anchor="middle">${esc(t)}</text>`});

  });

  const elegir=ev=>{const r=svg.getBoundingClientRect(),i=Math.floor((ev.clientX-r.left-L)/slot);if(i>=0&&i<n)seleccionar(i)};
  svg.addEventListener("pointerdown",ev=>{abajo=true;elegir(ev)});

    if(d){ev.preventDefault();seleccionar(Math.max(0,Math.min(n-1,(G.sel<0?(d>0?-1:n):G.sel)+d)))}
    else if(ev.key==="Home"){ev.preventDefault();seleccionar(0)}else if(ev.key==="End"){ev.preventDefault();seleccionar(n-1)}
  });
  if(G.sel>=0)mostrarDetalle();
}
function seleccionar(i){
  if(G.sel===i)return;
  const svg=$("#graf");
  if(G.sel>=0){const a=svg.querySelector(`.col[data-i="${G.sel}"]`);if(a)a.classList.remove("sel")}
  G.sel=i;const b=svg.querySelector(`.col[data-i="${i}"]`);if(b)b.classList.add("sel");
  mostrarDetalle();
}
function mostrarDetalle(){
  const x=G.items[G.sel],box=$("#det");if(!x||!box)return;
  let t=`<b>${esc(nombreBarra(x))}</b>`;
  if(x.estado==="falta")t+=': <span class="warn">sin datos</span> · la PC no lo subió.';
  else if(x.estado==="futuro")t+=": todavía no llegó.";
  else if(x.estado==="vacio")t+=": sin movimiento (no hubo ventas ni caja).";
  else{
    t+=` · ${m(x.total)} · ${$$(x.tickets)} ${x.tickets===1?"ticket":"tickets"}`;
    if(x.dif)t+=` · caja: <span class="bad">${x.dif>0?"sobran":"faltan"} ${m(Math.abs(x.dif))}</span>`;
    if(x.dif_dig)t+=` · medios digitales: <span class="bad">${x.dif_dig>0?"sobran":"faltan"} ${m(Math.abs(x.dif_dig))}</span>`;
    if(x.faltan)t+=` · <span class="warn">faltan ${x.faltan} ${x.faltan===1?"día":"días"} de datos</span>`;
  }
  if(!G.agr&&x.estado!=="futuro")t+=` <button id="ver" data-d="${x.dia}">Ver este día</button>`;
  box.innerHTML=t;
  const v=$("#ver");if(v)v.onclick=()=>{ref=v.dataset.d;vista="dia";scrollTo(0,0);cambiar()};
}
// ---------------------------------------------------------------- CSV del período (una fila por día; separador ";" y BOM para que Excel en español lo abra bien)
function celda(v){const s=String(v??"");return /[";\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvDelPeriodo(R){
  const num=v=>String(Math.round((v||0)*100)/100).replace(".",",");
  const est={datos:"Con datos",vacio:"Sin movimiento",falta:"Sin datos"};
  const filas=[["Fecha","Día","Estado","Total vendido","Tickets","Ticket promedio","Descuentos","Cobrado neto","Diferencia de caja (efectivo)","Diferencia de medios digitales"]];
  for(const d of R.dias){
    if(d.estado==="futuro")continue;
    const base=[d.dia,fmt(d.dia,{weekday:"long"}),est[d.estado]];
    if(d.estado==="falta")filas.push([...base,"","","","","","",""]);
    else filas.push([...base,num(d.total),d.tickets,d.tickets?num(Math.round(d.total/d.tickets)):"",num(d.descuentos),num(d.cobrado),num(d.dif),num(d.dif_dig)]);
  }
  return "﻿"+filas.map(f=>f.map(celda).join(";")).join("\r\n")+"\r\n";
}
function bajarCsv(){
  if(!ult)return;
  const {R,p}=ult;
  const nombre=`reporte_${vista}_${p.desde}_a_${p.hasta}.csv`;
  const blob=new Blob([csvDelPeriodo(R)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
